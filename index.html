<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2563eb" id="themeColorMeta">
    <title>Ngutang Pro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 900: '#1e3a8a' }
                    }
                }
            }
        }
        
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        input[type="text"], input[type="number"], input[type="tel"], input[type="date"] { font-size: 16px; }
        * { -webkit-tap-highlight-color: transparent; }
        
        /* Accordion transition */
        .accordion-content {
            transition: max-height 0.4s ease-in-out, opacity 0.3s ease-in-out;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
        }
        .accordion-content.expanded {
            max-height: 2500px; 
            opacity: 1;
        }

        /* Tabs */
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Bottom Sheet Transitions */
        .bottom-sheet-overlay { transition: opacity 0.3s ease; }
        .bottom-sheet-content { transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .hidden-sheet { pointer-events: none; }
        .hidden-sheet .bottom-sheet-overlay { opacity: 0; }
        .hidden-sheet .bottom-sheet-content { transform: translateY(100%); }

        /* Custom Checkbox */
        .custom-checkbox {
            appearance: none;
            width: 22px; height: 22px;
            border-radius: 6px;
            border: 2px solid #cbd5e1;
            display: inline-flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s;
        }
        .dark .custom-checkbox { border-color: #475569; background: #1e293b; }
        .custom-checkbox:checked { background-color: #2563eb; border-color: #2563eb; }
        .custom-checkbox:checked::after {
            content: '✓'; color: white; font-weight: bold; font-size: 14px;
        }
        
        /* Progress Bar Striping */
        .progress-striped {
            background-image: linear-gradient(45deg, rgba(255,255,255,.15) 25%, transparent 25%, transparent 50%, rgba(255,255,255,.15) 50%, rgba(255,255,255,.15) 75%, transparent 75%, transparent);
            background-size: 1rem 1rem;
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans pb-28 min-h-screen relative transition-colors duration-300">

    <header class="bg-gradient-to-br from-brand-600 to-brand-900 dark:from-slate-800 dark:to-slate-950 text-white pt-8 pb-6 px-5 shadow-lg rounded-b-3xl sticky top-0 z-20">
        <div class="max-w-md mx-auto">
            <div class="flex justify-between items-start mb-4">
                <div class="flex items-center gap-3">
                    <div class="bg-white/20 p-2 rounded-xl backdrop-blur-sm shadow-inner">
                        <i class="ph ph-wallet text-2xl text-white"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold tracking-tight">Ngutang Pro</h1>
                    </div>
                </div>
                <div class="flex items-center gap-1">
                    <button onclick="toggleTheme()" class="p-2 hover:bg-white/10 rounded-lg transition-colors">
                        <i id="themeIcon" class="ph-fill ph-moon text-2xl"></i>
                    </button>
                    <button onclick="openSheet('settingsSheet')" class="p-2 hover:bg-white/10 rounded-lg transition-colors">
                        <i class="ph ph-dots-three-outline-vertical text-2xl"></i>
                    </button>
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-3 mt-4">
                <div class="bg-white/10 rounded-2xl p-4 border border-white/20 backdrop-blur-md">
                    <p class="text-blue-100 dark:text-slate-300 text-[11px] font-semibold mb-1 uppercase tracking-wider">Total Utang (Sisa)</p>
                    <h2 id="totalGlobalDebt" class="text-2xl font-extrabold tracking-tight truncate">Rp 0</h2>
                </div>
                <div class="bg-white/5 rounded-2xl p-4 border border-white/10 backdrop-blur-md">
                    <p class="text-blue-100/70 dark:text-slate-400 text-[11px] font-semibold mb-1 uppercase tracking-wider">Uang Masuk</p>
                    <h2 id="totalGlobalPaid" class="text-xl font-bold tracking-tight truncate text-emerald-300">Rp 0</h2>
                </div>
            </div>
        </div>
    </header>

    <div class="max-w-md mx-auto px-4 mt-6 mb-4">
        <div class="flex bg-slate-200/70 dark:bg-slate-800 p-1.5 rounded-xl shadow-inner">
            <button onclick="switchTab('active')" id="tabBtn-active" class="flex-1 py-2.5 text-sm font-bold rounded-lg bg-white dark:bg-slate-700 shadow-sm text-brand-700 dark:text-blue-300 transition-all">
                Aktif
            </button>
            <button onclick="switchTab('history')" id="tabBtn-history" class="flex-1 py-2.5 text-sm font-medium rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 transition-all">
                Riwayat
            </button>
        </div>
    </div>

    <main class="max-w-md mx-auto px-4 space-y-5">
        
        <!-- Tab: Aktif -->
        <div id="tab-active" class="tab-content active space-y-4">
            <div id="activeList" class="space-y-4"></div>
        </div>

        <!-- Tab: History -->
        <div id="tab-history" class="tab-content space-y-4">
            <div class="flex items-center bg-white dark:bg-slate-800 p-1.5 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
                <div class="pl-3 text-slate-400"><i class="ph-bold ph-funnel"></i></div>
                <select id="historyFilter" onchange="renderHistory()" class="w-full bg-transparent border-none text-sm font-medium focus:ring-0 text-slate-700 dark:text-slate-200 py-2.5 px-2 outline-none appearance-none">
                    <option value="all">Semua Riwayat Lunas & Cicilan</option>
                    <!-- Options populated via JS -->
                </select>
                <div class="pr-3 text-slate-400 pointer-events-none"><i class="ph-bold ph-caret-down text-sm"></i></div>
            </div>
            
            <div id="historyList" class="space-y-4"></div>
        </div>
    </main>

    <button onclick="openSheet('addPersonSheet')" class="fixed bottom-6 right-6 w-14 h-14 bg-brand-600 hover:bg-brand-700 active:bg-brand-800 text-white rounded-full shadow-[0_8px_20px_rgba(37,99,235,0.4)] flex items-center justify-center transition-transform transform hover:scale-105 z-30">
        <i class="ph-bold ph-user-plus text-2xl"></i>
    </button>

    
    <!-- Sheet: Add Person -->
    <div id="addPersonSheet" class="fixed inset-0 z-50 flex items-end justify-center hidden-sheet">
        <div class="bottom-sheet-overlay absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onclick="closeSheet('addPersonSheet')"></div>
        <div class="bottom-sheet-content relative w-full max-w-md bg-white dark:bg-slate-800 rounded-t-3xl p-6 shadow-2xl">
            <div class="w-12 h-1.5 bg-slate-200 dark:bg-slate-700 rounded-full mx-auto mb-6"></div>
            <h3 class="text-xl font-bold mb-5 flex items-center gap-2"><i class="ph-fill ph-user-plus text-brand-500"></i> Teman Baru</h3>
            <form onsubmit="addPerson(event)" class="space-y-4">
                <div>
                    <input type="text" id="newPersonName" placeholder="Nama Orang (contoh: Budi)" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3.5 focus:outline-none focus:ring-2 focus:ring-brand-500 text-slate-800 dark:text-slate-100 transition-all" required />
                </div>
                <div class="relative">
                    <span class="absolute left-4 top-3.5 text-slate-400"><i class="ph-fill ph-whatsapp-logo text-lg"></i></span>
                    <input type="tel" id="newPersonPhone" placeholder="No. WA (Opsional: 0812...)" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl pl-11 pr-4 py-3.5 focus:outline-none focus:ring-2 focus:ring-brand-500 text-slate-800 dark:text-slate-100 transition-all" />
                </div>
                <button type="submit" class="w-full mt-2 bg-brand-600 hover:bg-brand-700 text-white px-5 py-4 rounded-xl font-bold shadow-md transition-colors text-lg">Simpan Orang</button>
            </form>
        </div>
    </div>

    <!-- Sheet: Add Item -->
    <div id="addItemSheet" class="fixed inset-0 z-50 flex items-end justify-center hidden-sheet">
        <div class="bottom-sheet-overlay absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onclick="closeSheet('addItemSheet')"></div>
        <div class="bottom-sheet-content relative w-full max-w-md bg-white dark:bg-slate-800 rounded-t-3xl p-6 shadow-2xl">
            <div class="w-12 h-1.5 bg-slate-200 dark:bg-slate-700 rounded-full mx-auto mb-6"></div>
            <h3 class="text-xl font-bold mb-1 flex items-center gap-2"><i class="ph-fill ph-receipt text-brand-500"></i> Tambah Catatan Bon</h3>
            <p id="addItemPersonName" class="text-sm text-slate-500 dark:text-slate-400 mb-5">Untuk: -</p>
            <form onsubmit="addItem(event)" class="space-y-4">
                <input type="hidden" id="addItemPersonId">
                <div class="flex gap-3">
                    <div class="relative w-2/5">
                        <span class="absolute left-3 top-3.5 text-slate-400"><i class="ph-fill ph-calendar-blank"></i></span>
                        <input type="date" id="newItemDate" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl pl-9 pr-2 py-3.5 text-sm focus:ring-2 focus:ring-brand-500 text-slate-800 dark:text-slate-100" required/>
                    </div>
                    <input type="text" id="newItemName" placeholder="Pesanan (cth: Nasi Goreng)" class="flex-1 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3.5 focus:ring-2 focus:ring-brand-500 text-slate-800 dark:text-slate-100" required/>
                </div>
                <div class="relative">
                    <span class="absolute left-4 top-3.5 text-slate-500 font-bold">Rp</span>
                    <input type="text" inputmode="numeric" oninput="formatPriceInput(this)" id="newItemPrice" placeholder="15.000" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl pl-12 pr-4 py-3.5 text-lg font-bold focus:ring-2 focus:ring-brand-500 text-slate-800 dark:text-slate-100" required/>
                </div>
                <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white px-5 py-4 rounded-xl font-bold shadow-md transition-colors text-lg">Catat Bon</button>
            </form>
        </div>
    </div>

    <!-- Sheet: Payment (Cicil) -->
    <div id="paymentSheet" class="fixed inset-0 z-50 flex items-end justify-center hidden-sheet">
        <div class="bottom-sheet-overlay absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onclick="closeSheet('paymentSheet')"></div>
        <div class="bottom-sheet-content relative w-full max-w-md bg-white dark:bg-slate-800 rounded-t-3xl p-6 shadow-2xl">
            <div class="w-12 h-1.5 bg-slate-200 dark:bg-slate-700 rounded-full mx-auto mb-6"></div>
            <h3 class="text-xl font-bold mb-1">Bayar / Cicil Item</h3>
            <p id="payItemTitle" class="text-sm font-medium text-slate-500 dark:text-slate-400 mb-4 bg-slate-100 dark:bg-slate-900 p-3 rounded-lg border border-slate-200 dark:border-slate-700 truncate"></p>
            
            <form onsubmit="processPayment(event)" class="space-y-4">
                <input type="hidden" id="payPersonId">
                <input type="hidden" id="payItemId">
                <input type="hidden" id="payMaxAmount">
                
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Jumlah Pembayaran</label>
                    <div class="relative">
                        <span class="absolute left-4 top-3.5 text-brand-600 dark:text-brand-400 font-bold">Rp</span>
                        <input type="text" inputmode="numeric" oninput="formatPriceInput(this)" id="payAmountInput" class="w-full bg-brand-50 dark:bg-slate-900 border-2 border-brand-200 dark:border-brand-700 rounded-xl pl-12 pr-4 py-3.5 text-2xl font-bold focus:ring-brand-500 text-brand-700 dark:text-brand-300" required/>
                    </div>
                    <div class="flex justify-between items-center mt-2">
                        <span class="text-xs text-slate-400">Pilih cepat:</span>
                        <button type="button" onclick="setFullPayment()" id="btnSetFull" class="text-xs font-bold bg-brand-100 dark:bg-brand-900/40 text-brand-600 dark:text-brand-300 px-3 py-1.5 rounded-lg border border-brand-200 dark:border-brand-700">Lunas Semua (Rp 0)</button>
                    </div>
                </div>
                
                <button type="submit" class="w-full mt-4 bg-emerald-500 hover:bg-emerald-600 text-white px-5 py-4 rounded-xl font-bold shadow-md flex justify-center items-center gap-2 text-lg">
                    <i class="ph-bold ph-check-circle text-xl"></i> Konfirmasi Pembayaran
                </button>
            </form>
        </div>
    </div>

    <!-- Sheet: Settings -->
    <div id="settingsSheet" class="fixed inset-0 z-50 flex items-end justify-center hidden-sheet">
        <div class="bottom-sheet-overlay absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onclick="closeSheet('settingsSheet')"></div>
        <div class="bottom-sheet-content relative w-full max-w-md bg-white dark:bg-slate-800 rounded-t-3xl p-6 shadow-2xl">
            <div class="w-12 h-1.5 bg-slate-200 dark:bg-slate-700 rounded-full mx-auto mb-6"></div>
            <h3 class="text-xl font-bold text-slate-800 dark:text-slate-100 mb-5">Pengaturan</h3>
            
            <div class="space-y-3">
                <button id="installBtn" class="hidden w-full flex items-center gap-4 p-4 bg-purple-50 dark:bg-purple-900/30 border border-purple-100 dark:border-purple-800 rounded-2xl text-purple-700 dark:text-purple-400 hover:bg-purple-100 text-left transition-colors">
                    <i class="ph-fill ph-download text-3xl"></i>
                    <div><div class="font-bold">Instal ke HP</div><div class="text-xs opacity-80 mt-0.5">Jadikan seperti aplikasi biasa</div></div>
                </button>

                <button onclick="exportData()" class="w-full flex items-center gap-4 p-4 bg-blue-50 dark:bg-brand-900/30 border border-blue-100 dark:border-brand-800 rounded-2xl text-brand-700 dark:text-brand-400 hover:bg-blue-100 text-left transition-colors">
                    <i class="ph-bold ph-export text-3xl"></i>
                    <div><div class="font-bold">Backup Data (Export)</div><div class="text-xs opacity-80 mt-0.5">Simpan ke file aman</div></div>
                </button>
                
                <label class="w-full flex items-center gap-4 p-4 bg-emerald-50 dark:bg-emerald-900/30 border border-emerald-100 dark:border-emerald-800 rounded-2xl text-emerald-700 dark:text-emerald-400 hover:bg-emerald-100 text-left transition-colors cursor-pointer">
                    <i class="ph-bold ph-import text-3xl"></i>
                    <div><div class="font-bold">Restore Data (Import)</div><div class="text-xs opacity-80 mt-0.5">Kembalikan data dari file</div></div>
                    <input type="file" id="importFile" accept=".json" class="hidden" onchange="importData(event)" />
                </label>
                
                <button onclick="triggerClearData()" class="w-full flex items-center gap-4 p-4 bg-red-50 dark:bg-red-900/30 border border-red-100 dark:border-red-900 rounded-2xl text-red-600 dark:text-red-400 hover:bg-red-100 text-left mt-4 transition-colors">
                    <i class="ph-bold ph-trash text-3xl"></i><div class="font-bold">Hapus Semua Data</div>
                </button>
            </div>
        </div>
    </div>

    <!-- Custom Dialogs System -->
    <div id="customDialogOverlay" class="fixed inset-0 bg-slate-900/70 z-[100] hidden flex items-center justify-center p-4 backdrop-blur-sm opacity-0 transition-opacity">
        <div id="customDialogBox" class="bg-white dark:bg-slate-800 w-full max-w-sm rounded-3xl p-6 shadow-2xl transform scale-95 transition-transform">
            <h3 id="dialogTitle" class="text-xl font-bold text-slate-800 dark:text-white mb-2">Konfirmasi</h3>
            <p id="dialogMessage" class="text-slate-500 dark:text-slate-400 mb-6 leading-relaxed">Pesan</p>
            <div class="flex gap-3 justify-end">
                <button id="dialogBtnCancel" onclick="closeDialog()" class="px-5 py-2.5 rounded-xl font-bold text-slate-500 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-700 transition-colors">Batal</button>
                <button id="dialogBtnConfirm" class="px-5 py-2.5 rounded-xl font-bold bg-brand-600 text-white hover:bg-brand-700 transition-colors">Ya, Lanjutkan</button>
            </div>
        </div>
    </div>

    <script>
        // Data Structure Map
        const defaultData = { active: [], history: [] };
        let appData = defaultData;
        let expandedPersonId = null;
        let selectedCheckboxes = {}; // { personId: [itemId1, itemId2] }

        // --- Core Helpers ---
        const formatRupiah = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num);
        const formatNumber = (num) => new Intl.NumberFormat('id-ID').format(num);
        const getRawNumber = (str) => parseInt(str.replace(/[^0-9]/g, '')) || 0;
        const getTodayDate = () => new Date().toISOString().split('T')[0];
        
        function formatPriceInput(input) {
            let val = input.value.replace(/[^0-9]/g, '');
            input.value = val ? formatNumber(val) : '';
        }

        function getCurrentTimeStr() {
            const now = new Date();
            return `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
        }

        // --- Data Management ---
        function loadData() {
            try {
                const stored = localStorage.getItem('ngutangProDataV2');
                if (stored) appData = JSON.parse(stored);
                // Migrasi data lama v1 jika ada
                else if (localStorage.getItem('ngutangProData')) {
                    const old = JSON.parse(localStorage.getItem('ngutangProData'));
                    // adapt to new structure if needed, or just assign
                    if(old.active) appData = old;
                    localStorage.removeItem('ngutangProData'); // Bersihkan
                    saveData();
                }
            } catch (e) { appData = defaultData; }
        }

        function saveData() {
            localStorage.setItem('ngutangProDataV2', JSON.stringify(appData));
            renderUI();
        }

        // --- Dialog System (Replacing Alert/Confirm) ---
        let dialogConfirmCallback = null;
        function showConfirm(title, message, callback, btnText = "Ya, Lanjutkan", btnColor = "bg-brand-600") {
            document.getElementById('dialogTitle').innerText = title;
            document.getElementById('dialogMessage').innerText = message;
            
            const btnConfirm = document.getElementById('dialogBtnConfirm');
            btnConfirm.innerText = btnText;
            btnConfirm.className = `px-5 py-2.5 rounded-xl font-bold text-white transition-colors ${btnColor}`;
            
            document.getElementById('dialogBtnCancel').classList.remove('hidden');
            
            dialogConfirmCallback = callback;
            
            const overlay = document.getElementById('customDialogOverlay');
            const box = document.getElementById('customDialogBox');
            overlay.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.add('opacity-100');
                box.classList.remove('scale-95');
                box.classList.add('scale-100');
            }, 10);
        }

        function showAlert(title, message) {
            document.getElementById('dialogTitle').innerText = title;
            document.getElementById('dialogMessage').innerText = message;
            
            const btnConfirm = document.getElementById('dialogBtnConfirm');
            btnConfirm.innerText = "Tutup";
            btnConfirm.className = `px-5 py-2.5 rounded-xl font-bold bg-brand-600 text-white transition-colors`;
            
            document.getElementById('dialogBtnCancel').classList.add('hidden');
            
            dialogConfirmCallback = null;
            
            const overlay = document.getElementById('customDialogOverlay');
            const box = document.getElementById('customDialogBox');
            overlay.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.add('opacity-100');
                box.classList.remove('scale-100'); // ensure reset
            }, 10);
        }

        document.getElementById('dialogBtnConfirm').addEventListener('click', () => {
            if (dialogConfirmCallback) dialogConfirmCallback();
            closeDialog();
        });

        function closeDialog() {
            const overlay = document.getElementById('customDialogOverlay');
            const box = document.getElementById('customDialogBox');
            overlay.classList.remove('opacity-100');
            box.classList.remove('scale-100');
            box.classList.add('scale-95');
            setTimeout(() => overlay.classList.add('hidden'), 200);
        }

        // --- UI Interactions ---
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');

            const btnActive = document.getElementById('tabBtn-active');
            const btnHistory = document.getElementById('tabBtn-history');
            
            const activeStyle = "flex-1 py-2.5 text-sm font-bold rounded-lg bg-white dark:bg-slate-700 shadow-sm text-brand-700 dark:text-blue-300 transition-all";
            const inactiveStyle = "flex-1 py-2.5 text-sm font-medium rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 transition-all";

            if(tab === 'active') {
                btnActive.className = activeStyle;
                btnHistory.className = inactiveStyle;
                renderUI();
            } else {
                btnHistory.className = activeStyle;
                btnActive.className = inactiveStyle;
                renderHistory();
            }
        }

        function toggleAccordion(personId) {
            expandedPersonId = expandedPersonId === personId ? null : personId;
            renderUI();
        }

        function openSheet(sheetId) {
            const sheet = document.getElementById(sheetId);
            sheet.classList.remove('hidden-sheet');
            
            // Set default date if AddItem
            if (sheetId === 'addItemSheet') {
                document.getElementById('newItemDate').value = getTodayDate();
                setTimeout(() => document.getElementById('newItemName').focus(), 300);
            }
        }

        function closeSheet(sheetId) {
            document.getElementById(sheetId).classList.add('hidden-sheet');
        }

        function addPerson(e) {
            e.preventDefault();
            const nameInput = document.getElementById('newPersonName');
            const phoneInput = document.getElementById('newPersonPhone');
            
            const name = nameInput.value.trim();
            let phone = phoneInput.value.replace(/\D/g, '');
            if (!name) return;
            if (phone.startsWith('0')) phone = '62' + phone.substring(1); 

            appData.active.unshift({
                id: 'p_' + Date.now().toString(),
                name: name,
                phone: phone,
                items: []
            });

            nameInput.value = '';
            phoneInput.value = '';
            closeSheet('addPersonSheet');
            saveData();
        }

        function triggerDeletePerson(personId) {
            showConfirm("Hapus Teman?", "Orang ini dan semua catatan hutangnya yang belum lunas akan dihapus permanen.", () => {
                appData.active = appData.active.filter(p => p.id !== personId);
                delete selectedCheckboxes[personId];
                saveData();
            }, "Hapus", "bg-red-500 hover:bg-red-600");
        }

        function triggerAddItem(personId, personName, event) {
            event.stopPropagation();
            document.getElementById('addItemPersonId').value = personId;
            document.getElementById('addItemPersonName').innerText = `Untuk: ${personName}`;
            document.getElementById('newItemName').value = '';
            document.getElementById('newItemPrice').value = '';
            openSheet('addItemSheet');
        }

        function addItem(e) {
            e.preventDefault();
            const personId = document.getElementById('addItemPersonId').value;
            const dateInput = document.getElementById('newItemDate').value;
            const nameInput = document.getElementById('newItemName').value.trim();
            const rawPrice = getRawNumber(document.getElementById('newItemPrice').value);
            
            if (!nameInput || !rawPrice || !dateInput) return;

            const d = new Date(dateInput);
            const formattedDate = `${d.getDate()}/${d.getMonth() + 1}`; 

            const person = appData.active.find(p => p.id === personId);
            if (person) {
                person.items.push({
                    id: 'i_' + Date.now().toString(),
                    date: formattedDate,
                    rawDate: dateInput,
                    name: nameInput,
                    originalPrice: rawPrice,
                    paidAmount: 0,
                    remainingPrice: rawPrice
                });
            }

            closeSheet('addItemSheet');
            if (expandedPersonId !== personId) toggleAccordion(personId); // Auto buka accordion
            else saveData(); // Jika sudah buka, render saja
        }

        function triggerDeleteItem(personId, itemId, event) {
            event.stopPropagation();
            showConfirm("Hapus Item?", "Catatan pesanan ini akan dihapus.", () => {
                const person = appData.active.find(p => p.id === personId);
                if (person) {
                    person.items = person.items.filter(i => i.id !== itemId);
                    // Remove from selection if exists
                    if (selectedCheckboxes[personId]) {
                        selectedCheckboxes[personId] = selectedCheckboxes[personId].filter(id => id !== itemId);
                    }
                    saveData();
                }
            }, "Hapus", "bg-red-500 hover:bg-red-600");
        }

        function triggerPayment(personId, itemId, event) {
            event.stopPropagation();
            const person = appData.active.find(p => p.id === personId);
            const item = person.items.find(i => i.id === itemId);
            
            document.getElementById('payPersonId').value = personId;
            document.getElementById('payItemId').value = itemId;
            document.getElementById('payMaxAmount').value = item.remainingPrice;
            document.getElementById('payAmountInput').value = '';
            
            document.getElementById('payItemTitle').innerText = `${item.name} (Sisa: ${formatRupiah(item.remainingPrice)})`;
            document.getElementById('btnSetFull').innerText = `Lunas (${formatNumber(item.remainingPrice)})`;
            
            openSheet('paymentSheet');
            setTimeout(() => document.getElementById('payAmountInput').focus(), 300);
        }

        function setFullPayment() {
            const max = document.getElementById('payMaxAmount').value;
            const input = document.getElementById('payAmountInput');
            input.value = formatNumber(max);
        }

        function processPayment(e) {
            e.preventDefault();
            const personId = document.getElementById('payPersonId').value;
            const itemId = document.getElementById('payItemId').value;
            const payAmount = getRawNumber(document.getElementById('payAmountInput').value);
            
            const person = appData.active.find(p => p.id === personId);
            if (!person) return;
            const itemIndex = person.items.findIndex(i => i.id === itemId);
            if (itemIndex === -1) return;
            const item = person.items[itemIndex];

            if (payAmount <= 0) return;
            
            const actualPayment = Math.min(payAmount, item.remainingPrice);
            
            // Rekam Histori Transaksi
            recordHistoryEvent(person, [{ name: item.name, paidAmount: actualPayment }], actualPayment, item.remainingPrice <= actualPayment);

            item.paidAmount += actualPayment;
            item.remainingPrice -= actualPayment;

            // Jika lunas, hapus dari list aktif
            if (item.remainingPrice <= 0) {
                person.items.splice(itemIndex, 1);
                // Clear from checkboxes
                if (selectedCheckboxes[personId]) {
                    selectedCheckboxes[personId] = selectedCheckboxes[personId].filter(id => id !== itemId);
                }
            }

            closeSheet('paymentSheet');
            saveData();
            showAlert("Berhasil", "Pembayaran / Cicilan berhasil dicatat!");
        }

        function toggleCheckbox(personId, itemId) {
            if (!selectedCheckboxes[personId]) selectedCheckboxes[personId] = [];
            const index = selectedCheckboxes[personId].indexOf(itemId);
            if (index > -1) {
                selectedCheckboxes[personId].splice(index, 1);
            } else {
                selectedCheckboxes[personId].push(itemId);
            }
            renderUI(); // Update UI for the Lunas button counter
        }

        function paySelectedItems(personId, event) {
            event.stopPropagation();
            const person = appData.active.find(p => p.id === personId);
            const selectedIds = selectedCheckboxes[personId] || [];
            
            if (selectedIds.length === 0) return;

            showConfirm("Lunas Terpilih?", `Tandai ${selectedIds.length} item terpilih lunas penuh?`, () => {
                let totalPaidThisTransaction = 0;
                let paidItemsInfo = [];

                selectedIds.forEach(itemId => {
                    const itemIndex = person.items.findIndex(i => i.id === itemId);
                    if (itemIndex > -1) {
                        const item = person.items[itemIndex];
                        totalPaidThisTransaction += item.remainingPrice;
                        paidItemsInfo.push({ name: item.name, paidAmount: item.remainingPrice });
                        
                        // Lunas
                        item.paidAmount += item.remainingPrice;
                        item.remainingPrice = 0;
                    }
                });

                // Rekam ke history
                recordHistoryEvent(person, paidItemsInfo, totalPaidThisTransaction, true);

                // Buang item lunas
                person.items = person.items.filter(i => !selectedIds.includes(i.id));
                selectedCheckboxes[personId] = []; // Clear selection
                
                saveData();
                showAlert("Berhasil", "Item terpilih telah lunas!");
            }, "Lunaskan", "bg-emerald-500 hover:bg-emerald-600");
        }

        function recordHistoryEvent(person, itemsInfo, totalAmount, isFull = false) {
            const today = new Date();
            appData.history.unshift({
                id: 'h_' + Date.now().toString(),
                personId: person.id,
                personName: person.name,
                date: today.toLocaleDateString('id-ID'),
                time: getCurrentTimeStr(),
                type: isFull ? 'full' : 'partial',
                items: itemsInfo,
                totalAmount: totalAmount
            });
        }

        function shareWhatsApp(personId, event) {
            event.stopPropagation();
            const person = appData.active.find(p => p.id === personId);
            if (!person || person.items.length === 0) return;

            let totalSisa = 0;
            let message = `*Rincian Tagihan*\n\n`;
            
            person.items.forEach((item) => {
                totalSisa += item.remainingPrice;
                if (item.paidAmount > 0) {
                    message += `▪ ${item.date} ${item.name}\n  Biaya: ${formatNumber(item.originalPrice)}\n  Dicicil: -${formatNumber(item.paidAmount)}\n  Sisa: *${formatNumber(item.remainingPrice)}*\n`;
                } else {
                    message += `▪ ${item.date} ${item.name} = *${formatNumber(item.originalPrice)}*\n`;
                }
            });
            message += `\n*TOTAL TAGIHAN: ${formatNumber(totalSisa)}*`;

            const encodedMessage = encodeURIComponent(message);
            const whatsappUrl = person.phone 
                ? `https://wa.me/${person.phone}?text=${encodedMessage}`
                : `https://wa.me/?text=${encodedMessage}`;
            window.open(whatsappUrl, '_blank');
        }

        function exportData() {
            const dataStr = JSON.stringify(appData);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Backup_NgutangPro_${new Date().toLocaleDateString('id-ID').replace(/\//g, '-')}.json`;
            a.click();
            URL.revokeObjectURL(url);
            closeSheet('settingsSheet');
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported.active) {
                        appData = imported;
                        saveData();
                        closeSheet('settingsSheet');
                        showAlert("Sukses", "Data berhasil dikembalikan.");
                    }
                } catch (err) { showAlert("Error", "Format file tidak valid."); }
            };
            reader.readAsText(file);
        }

        function triggerClearData() {
            showConfirm("Hapus SEMUA Data?", "Semua data aktif dan riwayat akan hilang selamanya. Lanjutkan?", () => {
                appData = { active: [], history: [] };
                selectedCheckboxes = {};
                saveData();
                closeSheet('settingsSheet');
            }, "Hapus Semua", "bg-red-500 hover:bg-red-600");
        }

        function renderUI() {
            let globalDebt = 0;
            let globalPaid = 0; // Total uang diterima dari Cicilan aktif ATAU History

            appData.history.forEach(h => globalPaid += h.totalAmount);

            const activeContainer = document.getElementById('activeList');
            activeContainer.innerHTML = '';

            if (appData.active.length === 0) {
                activeContainer.innerHTML = `
                    <div class="flex flex-col items-center justify-center p-10 bg-white dark:bg-slate-800 rounded-2xl border border-dashed border-slate-300 dark:border-slate-700 text-slate-400">
                        <i class="ph-fill ph-users text-5xl mb-3 text-slate-300 dark:text-slate-600"></i>
                        <p class="font-medium text-slate-500 dark:text-slate-400">Belum ada daftar teman.</p>
                        <p class="text-xs text-center mt-1">Gunakan tombol + di pojok kanan bawah.</p>
                    </div>`;
            } else {
                appData.active.forEach(person => {
                    let personTotalDebt = 0;
                    let personTotalPaid = 0;
                    let personTotalOriginal = 0;
                    
                    person.items.forEach(i => {
                        personTotalDebt += i.remainingPrice;
                        personTotalPaid += i.paidAmount;
                        personTotalOriginal += i.originalPrice;
                    });
                    
                    globalDebt += personTotalDebt;
                    globalPaid += personTotalPaid; // Tambahkan cicilan aktif ke Uang Masuk

                    const isExpanded = expandedPersonId === person.id;
                    const selectedIds = selectedCheckboxes[person.id] || [];
                    
                    let progressPercent = personTotalOriginal > 0 ? (personTotalPaid / personTotalOriginal) * 100 : 0;

                    let itemsHtml = person.items.length === 0 
                        ? `<div class="text-center py-5 bg-slate-50 dark:bg-slate-900/50 rounded-xl border border-dashed border-slate-200 dark:border-slate-700 text-slate-400 text-sm italic">Belum ada catatan bon</div>`
                        : `<div class="space-y-2.5 mb-4">` + person.items.map(item => {
                            const isChecked = selectedIds.includes(item.id);
                            const hasPaidPartial = item.paidAmount > 0;
                            return `
                            <div class="flex items-center gap-3 bg-white dark:bg-slate-800 p-3 rounded-xl border ${isChecked ? 'border-brand-500 bg-brand-50/30 dark:bg-brand-900/10 shadow-sm' : 'border-slate-100 dark:border-slate-700'} shadow-sm relative overflow-hidden transition-all" onclick="toggleCheckbox('${person.id}', '${item.id}')">
                                <!-- Checkbox area -->
                                <div class="flex-shrink-0 pt-1">
                                    <input type="checkbox" class="custom-checkbox" ${isChecked ? 'checked' : ''} onclick="event.stopPropagation(); toggleCheckbox('${person.id}', '${item.id}')">
                                </div>
                                <!-- Content -->
                                <div class="flex-1 min-w-0 flex flex-col justify-center">
                                    <div class="flex items-baseline justify-between mb-0.5 gap-2">
                                        <h4 class="text-slate-800 dark:text-slate-200 font-bold text-sm truncate capitalize">${item.name}</h4>
                                        <span class="text-[11px] font-bold text-brand-500 dark:text-brand-400 shrink-0 whitespace-nowrap">${item.date}</span>
                                    </div>
                                    <div class="flex items-center justify-between">
                                        <div class="flex flex-col">
                                            ${hasPaidPartial ? `<span class="text-[10px] text-slate-400 line-through -mb-1">${formatNumber(item.originalPrice)}</span>` : ''}
                                            <span class="font-black text-slate-700 dark:text-slate-300 text-sm tracking-tight">${formatRupiah(item.remainingPrice)}</span>
                                        </div>
                                        <div class="flex gap-2 relative z-10" onclick="event.stopPropagation()">
                                            <button onclick="triggerPayment('${person.id}', '${item.id}', event)" class="bg-brand-100 dark:bg-slate-700 hover:bg-brand-200 text-brand-700 dark:text-brand-300 p-2 rounded-lg transition-colors flex items-center justify-center shadow-sm">
                                                <i class="ph-bold ph-wallet text-sm"></i>
                                            </button>
                                            <button onclick="triggerDeleteItem('${person.id}', '${item.id}', event)" class="bg-red-50 dark:bg-slate-700 hover:bg-red-100 text-red-500 p-2 rounded-lg transition-colors flex items-center justify-center shadow-sm">
                                                <i class="ph-bold ph-trash text-sm"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                        }).join('') + `</div>`;

                    const card = document.createElement('div');
                    card.className = "bg-white dark:bg-slate-800 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden";
                    card.innerHTML = `
                        <!-- Header Accordion -->
                        <div onclick="toggleAccordion('${person.id}')" class="p-4 relative cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800/80 transition-colors select-none">
                            <div class="flex justify-between items-center z-10 relative">
                                <div class="flex items-center gap-3">
                                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-brand-100 to-brand-200 dark:from-brand-900 dark:to-slate-800 flex items-center justify-center text-brand-700 dark:text-brand-300 font-extrabold text-xl shadow-inner">
                                        ${person.name.charAt(0).toUpperCase()}
                                    </div>
                                    <div class="flex flex-col">
                                        <h3 class="font-bold text-[17px] text-slate-800 dark:text-slate-100 leading-tight">${person.name}</h3>
                                        <span class="text-[11px] text-slate-400 mt-0.5 flex items-center gap-1">
                                            <i class="ph-fill ph-whatsapp-logo text-emerald-500"></i> ${person.phone ? `+${person.phone}` : 'Tanpa No. WA'}
                                        </span>
                                    </div>
                                </div>
                                <div class="flex items-center gap-3">
                                    <div class="text-right">
                                        <div class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Sisa</div>
                                        <div class="font-black text-red-500 dark:text-red-400 text-[15px] tracking-tight">${formatNumber(personTotalDebt)}</div>
                                    </div>
                                    <div class="text-slate-300 dark:text-slate-500 transition-transform duration-300 ${isExpanded ? 'rotate-180' : ''}">
                                        <i class="ph-bold ph-caret-down text-xl"></i>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Progress bar -->
                            ${personTotalOriginal > 0 ? `
                                <div class="absolute bottom-0 left-0 right-0 h-1 bg-slate-100 dark:bg-slate-700">
                                    <div class="h-full bg-emerald-500 progress-striped transition-all duration-700" style="width: ${progressPercent}%"></div>
                                </div>
                            ` : ''}
                        </div>
                        
                        <!-- Content -->
                        <div class="accordion-content ${isExpanded ? 'expanded border-t border-slate-100 dark:border-slate-700 bg-slate-50/30 dark:bg-slate-900/30' : ''}">
                            <div class="p-4 pt-5 pb-2">
                                <div class="flex justify-between items-center mb-3">
                                    <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">Daftar Tagihan</span>
                                    <button onclick="triggerAddItem('${person.id}', '${person.name}', event)" class="bg-brand-100 text-brand-700 dark:bg-brand-900/40 dark:text-brand-300 hover:bg-brand-200 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 transition-colors">
                                        <i class="ph-bold ph-plus"></i> Bon Baru
                                    </button>
                                </div>
                                ${itemsHtml}
                            </div>
                            
                            <div class="p-4 flex gap-2 border-t border-slate-100 dark:border-slate-700/50 bg-white dark:bg-slate-800">
                                <button onclick="paySelectedItems('${person.id}', event)" ${selectedIds.length === 0 ? 'disabled' : ''} class="flex-1 bg-emerald-50 text-emerald-600 dark:bg-emerald-900/20 dark:text-emerald-500 border border-emerald-200 dark:border-emerald-800/50 disabled:opacity-40 disabled:bg-slate-50 disabled:text-slate-400 disabled:border-slate-200 py-3 rounded-xl text-sm font-bold flex flex-col items-center justify-center transition-all">
                                    <span class="flex items-center gap-1"><i class="ph-bold ph-check-square-offset"></i> Lunas Terpilih</span>
                                    <span class="text-[9px] mt-0.5 opacity-70 font-medium">${selectedIds.length > 0 ? selectedIds.length + ' item' : 'Centang item di atas'}</span>
                                </button>
                                <button onclick="shareWhatsApp('${person.id}', event)" ${person.items.length === 0 ? 'disabled' : ''} class="w-[30%] bg-[#25D366] hover:bg-[#128C7E] text-white disabled:opacity-40 py-3 rounded-xl text-sm font-bold flex flex-col items-center justify-center transition-all shadow-md">
                                    <i class="ph-bold ph-whatsapp-logo text-xl"></i>
                                    <span class="text-[9px] mt-0.5">Kirim WA</span>
                                </button>
                                <button onclick="triggerDeletePerson('${person.id}')" class="w-12 bg-red-50 dark:bg-red-900/20 text-red-500 hover:bg-red-100 flex items-center justify-center rounded-xl transition-all">
                                    <i class="ph-bold ph-trash text-lg"></i>
                                </button>
                            </div>
                        </div>
                    `;
                    activeContainer.appendChild(card);
                });
            }

            document.getElementById('totalGlobalDebt').innerText = formatRupiah(globalDebt);
            document.getElementById('totalGlobalPaid').innerText = formatRupiah(globalPaid);
            updateHistoryFilters();
        }

        function updateHistoryFilters() {
            const filter = document.getElementById('historyFilter');
            const currentVal = filter.value;
            filter.innerHTML = `<option value="all">Semua Riwayat Lunas & Cicilan</option>`;
            
            const uniqueNames = [...new Set(appData.history.map(item => item.personName))];
            uniqueNames.forEach(name => {
                filter.innerHTML += `<option value="${name}">${name}</option>`;
            });
            if(uniqueNames.includes(currentVal)) filter.value = currentVal;
        }

        function renderHistory() {
            const filterVal = document.getElementById('historyFilter').value;
            const container = document.getElementById('historyList');
            container.innerHTML = '';
            
            let filtered = appData.history;
            if (filterVal !== 'all') {
                filtered = appData.history.filter(h => h.personName === filterVal);
            }

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center p-6 text-slate-400 italic text-sm border border-dashed border-slate-300 dark:border-slate-700 rounded-2xl">Belum ada riwayat transaksi.</div>`;
                return;
            }

            filtered.forEach(history => {
                const isFull = history.type === 'full';
                const itemsDesc = history.items.map(i => `${i.name} (${formatNumber(i.paidAmount)})`).join(', ');

                container.innerHTML += `
                    <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 border-l-4 ${isFull ? 'border-emerald-500' : 'border-brand-500'} shadow-sm opacity-95">
                        <div class="flex justify-between items-start mb-2">
                            <div class="font-bold text-slate-700 dark:text-slate-200 flex items-center gap-2">
                                ${isFull ? '<i class="ph-fill ph-check-circle text-emerald-500 text-lg"></i>' : '<i class="ph-fill ph-clock-counter-clockwise text-brand-500 text-lg"></i>'}
                                <span>${history.personName} <span class="text-[10px] font-normal text-slate-400 bg-slate-100 dark:bg-slate-700 px-1.5 py-0.5 rounded ml-1">${isFull ? 'Lunas' : 'Cicilan'}</span></span>
                            </div>
                            <div class="text-right">
                                <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">${history.date}</div>
                                <div class="text-xs text-slate-500">${history.time}</div>
                            </div>
                        </div>
                        <div class="text-xs text-slate-500 dark:text-slate-400 mb-3 leading-relaxed border-b border-slate-100 dark:border-slate-700 pb-2">
                            ${itemsDesc}
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Nilai Transaksi</span>
                            <span class="font-black text-emerald-600 dark:text-emerald-400 text-lg tracking-tight">+ ${formatRupiah(history.totalAmount)}</span>
                        </div>
                    </div>
                `;
            });
        }

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeUI(isDark);
        }

        function updateThemeUI(isDark) {
            const icon = document.getElementById('themeIcon');
            const metaTheme = document.getElementById('themeColorMeta');
            if(isDark) {
                icon.classList.replace('ph-moon', 'ph-sun');
                metaTheme.setAttribute('content', '#1e293b'); // slate-800
            } else {
                icon.classList.replace('ph-sun', 'ph-moon');
                metaTheme.setAttribute('content', '#1e3a8a'); // brand-900
            }
        }

        (function setupPWA() {
            const manifest = {
                name: "Ngutang Pro", short_name: "Ngutang Pro", start_url: ".", display: "standalone",
                background_color: "#f8fafc", theme_color: "#2563eb",
                icons: [{
                    src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E%3Crect width='256' height='256' fill='none'/%3E%3Crect x='32' y='48' width='192' height='160' rx='8' fill='%232563eb'/%3E%3Cpath d='M32 104h192' fill='none' stroke='%23fff' stroke-linecap='round' stroke-linejoin='round' stroke-width='16'/%3E%3C/svg%3E",
                    sizes: "192x192", type: "image/svg+xml"
                }]
            };
            const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
            const pwaLink = document.createElement('link');
            pwaLink.rel = 'manifest';
            pwaLink.href = URL.createObjectURL(manifestBlob);
            document.head.appendChild(pwaLink);

            let deferredPrompt;
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                document.getElementById('installBtn').classList.remove('hidden');
            });

            document.getElementById('installBtn').addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') document.getElementById('installBtn').classList.add('hidden');
                    deferredPrompt = null;
                }
                closeSheet('settingsSheet');
            });
        })();

        // Init App
        loadData();
        renderUI();
        updateThemeUI(document.documentElement.classList.contains('dark'));
    </script>
</body>
</html>
