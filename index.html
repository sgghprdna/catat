<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2563eb" id="themeColorMeta">
    <title>Ngutang Pro</title>
    
    <!-- Tailwind CSS untuk Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Konfigurasi Tailwind untuk Dark Mode berbasis Class
        tailwind.config = {
            darkMode: 'class',
        }
        
        // Mencegah layar berkedip putih saat dark mode dimuat
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <!-- Phosphor Icons untuk Ikon -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        input[type="text"], input[type="number"], input[type="tel"], input[type="date"] {
            font-size: 16px;
        }
        * {
            -webkit-tap-highlight-color: transparent;
        }
        .accordion-content {
            transition: max-height 0.3s ease-in-out, opacity 0.3s ease-in-out;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
        }
        .accordion-content.expanded {
            max-height: 2000px; 
            opacity: 1;
        }
        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }
        .tab-content.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans pb-24 min-h-screen relative transition-colors duration-300">

    <header class="bg-gradient-to-br from-blue-600 to-indigo-800 dark:from-slate-800 dark:to-slate-950 text-white pt-8 pb-6 px-5 shadow-lg rounded-b-3xl sticky top-0 z-20 transition-colors duration-300">
        <div class="max-w-md mx-auto">
            <div class="flex justify-between items-start mb-4">
                <div class="flex items-center gap-3">
                    <div class="bg-white/20 p-2 rounded-xl backdrop-blur-sm">
                        <i class="ph ph-wallet text-2xl text-white"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold tracking-tight">Ngutang</h1>
                        <p class="text-blue-200 dark:text-slate-400 text-xs opacity-90">Versi Pro</p>
                    </div>
                </div>
                <div class="flex items-center gap-1">
                    <button onclick="toggleTheme()" class="p-2 hover:bg-white/10 rounded-lg transition-colors">
                        <i id="themeIcon" class="ph-fill ph-moon text-2xl"></i>
                    </button>
                    <button onclick="openMenu()" class="p-2 hover:bg-white/10 rounded-lg transition-colors">
                        <i class="ph ph-dots-three-outline-vertical text-2xl"></i>
                    </button>
                </div>
            </div>
            
            <div class="bg-white/10 rounded-2xl p-4 border border-white/20 mt-4 backdrop-blur-md">
                <p class="text-blue-100 dark:text-slate-300 text-sm font-medium mb-1">Total Uang di Luar</p>
                <h2 id="totalGlobal" class="text-3xl font-extrabold tracking-tight">Rp 0</h2>
            </div>
        </div>
    </header>

    <div class="max-w-md mx-auto px-4 mt-6 mb-4">
        <div class="flex bg-slate-200/70 dark:bg-slate-800/80 p-1 rounded-xl">
            <button onclick="switchTab('active')" id="tabBtn-active" class="flex-1 py-2 text-sm font-bold rounded-lg bg-white dark:bg-slate-700 shadow-sm text-blue-700 dark:text-blue-300 transition-all">
                Aktif
            </button>
            <button onclick="switchTab('history')" id="tabBtn-history" class="flex-1 py-2 text-sm font-medium rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 transition-all">
                Riwayat Lunas
            </button>
        </div>
    </div>

    <main class="max-w-md mx-auto px-4 space-y-5">
        
        <div id="tab-active" class="tab-content active space-y-5">
            <section class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200/60 dark:border-slate-700 transition-colors">
                <h2 class="text-base font-bold mb-4 flex items-center gap-2 text-slate-700 dark:text-slate-200">
                    <i class="ph-fill ph-user-plus text-lg text-blue-500"></i>
                    Tambah Catatan Orang
                </h2>
                <form onsubmit="addPerson(event)" class="flex flex-col gap-3">
                    <input type="text" id="newPersonName" placeholder="Nama Orang (contoh: Budi)" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3.5 focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800 dark:text-slate-100 transition-all" required />
                    <div class="flex gap-2">
                        <div class="relative flex-1">
                            <span class="absolute left-3 top-4 text-slate-400"><i class="ph-fill ph-whatsapp-logo text-lg"></i></span>
                            <input type="tel" id="newPersonPhone" placeholder="No. WA (0812...)" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl pl-10 pr-4 py-3.5 focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800 dark:text-slate-100 transition-all" />
                        </div>
                        <button type="submit" class="bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white px-5 py-3.5 rounded-xl transition-colors flex items-center justify-center shadow-md">
                            <i class="ph-bold ph-plus text-xl"></i>
                        </button>
                    </div>
                </form>
            </section>

            <div id="activeList" class="space-y-4"></div>
        </div>

        <div id="tab-history" class="tab-content space-y-4">
            <div id="historyList" class="space-y-4"></div>
        </div>

    </main>

    <div id="menuModal" class="fixed inset-0 bg-slate-900/60 z-50 hidden opacity-0 transition-opacity flex items-end sm:items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 w-full max-w-sm rounded-3xl p-6 shadow-2xl transform translate-y-full sm:translate-y-0 transition-transform duration-300" id="menuModalContent">
            <div class="flex justify-between items-center mb-5">
                <h3 class="text-xl font-bold text-slate-800 dark:text-slate-100">Pengaturan Data</h3>
                <button onclick="closeMenu()" class="p-2 bg-slate-100 dark:bg-slate-700 rounded-full text-slate-500 dark:text-slate-300"><i class="ph-bold ph-x text-lg"></i></button>
            </div>
            
            <div class="space-y-3">
                <!-- Tombol Install PWA -->
                <button id="installBtn" class="hidden w-full flex items-center gap-3 p-4 bg-purple-50 dark:bg-purple-900/30 border border-purple-100 dark:border-purple-800 rounded-2xl text-purple-700 dark:text-purple-400 font-semibold hover:bg-purple-100 dark:hover:bg-purple-900/50 transition-colors">
                    <i class="ph-bold ph-download text-2xl"></i>
                    <div class="text-left">
                        <div class="text-base">Instal ke HP</div>
                        <div class="text-xs font-normal opacity-80">Jadikan seperti aplikasi biasa</div>
                    </div>
                </button>

                <button onclick="exportData()" class="w-full flex items-center gap-3 p-4 bg-blue-50 dark:bg-blue-900/30 border border-blue-100 dark:border-blue-800 rounded-2xl text-blue-700 dark:text-blue-400 font-semibold hover:bg-blue-100 transition-colors">
                    <i class="ph-bold ph-download-simple text-2xl"></i>
                    <div class="text-left">
                        <div class="text-base">Backup Data (Export)</div>
                        <div class="text-xs font-normal opacity-80">Simpan ke file agar tidak hilang</div>
                    </div>
                </button>
                
                <label class="w-full flex items-center gap-3 p-4 bg-emerald-50 dark:bg-emerald-900/30 border border-emerald-100 dark:border-emerald-800 rounded-2xl text-emerald-700 dark:text-emerald-400 font-semibold hover:bg-emerald-100 transition-colors cursor-pointer">
                    <i class="ph-bold ph-upload-simple text-2xl"></i>
                    <div class="text-left">
                        <div class="text-base">Restore Data (Import)</div>
                        <div class="text-xs font-normal opacity-80">Kembalikan data dari file</div>
                    </div>
                    <input type="file" id="importFile" accept=".json" class="hidden" onchange="importData(event)" />
                </label>
                
                <button onclick="clearAllData()" class="w-full flex items-center gap-3 p-4 bg-red-50 dark:bg-red-900/30 border border-red-100 dark:border-red-800 rounded-2xl text-red-600 dark:text-red-400 font-semibold hover:bg-red-100 transition-colors mt-6">
                    <i class="ph-bold ph-trash text-2xl"></i>
                    <div class="text-left">
                        <div class="text-base">Hapus Semua Data</div>
                    </div>
                </button>
            </div>
        </div>
    </div>

    <script>
        const defaultData = { active: [], history: [] };
        let appData = defaultData;
        let expandedPersonId = null;
        let activeAddFormId = null;

        // Auto format angka menjadi ribuan saat diketik
        function formatPriceInput(input) {
            let val = input.value.replace(/[^0-9]/g, ''); // Hapus selain angka
            if(val !== '') {
                input.value = new Intl.NumberFormat('id-ID').format(val);
            } else {
                input.value = '';
            }
        }

        // Format Uang Rupiah (Dengan Prefix Rp)
        const formatRupiah = (number) => {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);
        };

        // Format Titik Saja (Tanpa Rp) untuk pesan WA
        const formatTitik = (number) => {
            return new Intl.NumberFormat('id-ID').format(number);
        };

        function loadData() {
            try {
                const stored = localStorage.getItem('ngutangProData');
                if (stored) {
                    appData = JSON.parse(stored);
                    if(Array.isArray(appData)) appData = { active: appData, history: [] }; // Fallback versi lama
                }
            } catch (e) {
                appData = defaultData;
            }
        }

        function saveData() {
            localStorage.setItem('ngutangProData', JSON.stringify(appData));
            renderUI();
        }

        const calculateTotal = (items) => items.reduce((total, item) => total + item.price, 0);

        function calculateGlobalTotal() {
            let total = 0;
            appData.active.forEach(person => total += calculateTotal(person.items));
            return total;
        }

        function addPerson(e) {
            e.preventDefault();
            const nameInput = document.getElementById('newPersonName');
            const phoneInput = document.getElementById('newPersonPhone');
            
            const name = nameInput.value.trim();
            let phone = phoneInput.value.replace(/\D/g, '');
            if (!name) return;
            if (phone.startsWith('0')) phone = '62' + phone.substring(1); 

            appData.active.unshift({
                id: 'p_' + Date.now().toString(),
                name: name,
                phone: phone,
                items: []
            });

            nameInput.value = '';
            phoneInput.value = '';
            saveData();
        }

        function deletePerson(personId) {
            if (confirm('Hapus orang ini beserta catatannya?')) {
                appData.active = appData.active.filter(p => p.id !== personId);
                saveData();
            }
        }

        function addItem(e, personId) {
            e.preventDefault();
            const dateInput = document.getElementById(`itemDate_${personId}`).value;
            const nameInput = document.getElementById(`itemName_${personId}`).value.trim();
            const priceInput = document.getElementById(`itemPrice_${personId}`).value;

            // Mengambil angka murni setelah titik dihapus (misal "15.000" jadi 15000)
            const rawPriceString = priceInput.replace(/[^0-9]/g, '');
            
            if (!nameInput || !rawPriceString || !dateInput) return;

            const d = new Date(dateInput);
            const formattedDate = `${d.getDate()}/${d.getMonth() + 1}`; 

            const person = appData.active.find(p => p.id === personId);
            if (person) {
                person.items.push({
                    id: 'i_' + Date.now().toString(),
                    date: formattedDate,
                    rawDate: dateInput,
                    name: nameInput,
                    price: parseInt(rawPriceString) // 100% jadi integer bulat akurat
                });
            }

            activeAddFormId = null; 
            saveData();
        }

        function deleteItem(personId, itemId, event) {
            event.stopPropagation();
            const person = appData.active.find(p => p.id === personId);
            if (person) {
                person.items = person.items.filter(i => i.id !== itemId);
                saveData();
            }
        }

        function markAsPaid(personId, event) {
            event.stopPropagation();
            if (confirm('Tandai sebagai LUNAS? Catatan akan dipindah ke tab Riwayat.')) {
                const personIndex = appData.active.findIndex(p => p.id === personId);
                if (personIndex > -1) {
                    const person = appData.active[personIndex];
                    appData.history.unshift({
                        id: 'h_' + Date.now().toString(),
                        name: person.name,
                        phone: person.phone,
                        clearedAt: new Date().toLocaleDateString('id-ID'),
                        total: calculateTotal(person.items),
                        items: [...person.items]
                    });
                    person.items = [];
                    saveData();
                }
            }
        }

        function shareWhatsApp(personId, event) {
            event.stopPropagation();
            const person = appData.active.find(p => p.id === personId);
            if (!person || person.items.length === 0) return;

            const total = calculateTotal(person.items);
            let message = ``;
            
            // Format rincian (dengan titik mata uang agar lebih mudah dibaca teman)
            person.items.forEach((item) => {
                message += `${item.date} ${item.name} ${formatTitik(item.price)}\n`;
            });
            message += `\n=${formatTitik(total)}`;

            const encodedMessage = encodeURIComponent(message);
            const whatsappUrl = person.phone 
                ? `https://wa.me/${person.phone}?text=${encodedMessage}`
                : `https://wa.me/?text=${encodedMessage}`;
            window.open(whatsappUrl, '_blank');
        }

        function exportData() {
            const dataStr = JSON.stringify(appData);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Backup_Ngutang_${new Date().toLocaleDateString('id-ID').replace(/\//g, '-')}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            closeMenu();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (importedData.active && Array.isArray(importedData.active)) {
                        appData = importedData;
                        saveData();
                        alert('Data berhasil direstore!');
                        closeMenu();
                    }
                } catch (err) {
                    alert('Gagal membaca file JSON.');
                }
            };
            reader.readAsText(file);
        }

        function clearAllData() {
            if(confirm("Hapus SEMUA data permanen?")) {
                appData = { active: [], history: [] };
                saveData();
                closeMenu();
            }
        }

        function switchTab(tab) {
            document.getElementById('tab-active').classList.remove('active');
            document.getElementById('tab-history').classList.remove('active');
            document.getElementById(`tab-${tab}`).classList.add('active');

            const btnActive = document.getElementById('tabBtn-active');
            const btnHistory = document.getElementById('tabBtn-history');
            
            if(tab === 'active') {
                btnActive.className = "flex-1 py-2 text-sm font-bold rounded-lg bg-white dark:bg-slate-700 shadow-sm text-blue-700 dark:text-blue-300 transition-all";
                btnHistory.className = "flex-1 py-2 text-sm font-medium rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 transition-all";
            } else {
                btnHistory.className = "flex-1 py-2 text-sm font-bold rounded-lg bg-white dark:bg-slate-700 shadow-sm text-blue-700 dark:text-blue-300 transition-all";
                btnActive.className = "flex-1 py-2 text-sm font-medium rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 transition-all";
            }
        }

        function toggleAccordion(personId) {
            expandedPersonId = expandedPersonId === personId ? null : personId;
            activeAddFormId = null; 
            renderUI();
        }

        function toggleAddForm(personId, event) {
            event.stopPropagation();
            activeAddFormId = activeAddFormId === personId ? null : personId;
            renderUI();
        }

        const openMenu = () => {
            const modal = document.getElementById('menuModal');
            const content = document.getElementById('menuModalContent');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.add('opacity-100');
                content.classList.remove('translate-y-full');
            }, 10);
        };

        const closeMenu = () => {
            const modal = document.getElementById('menuModal');
            const content = document.getElementById('menuModalContent');
            modal.classList.remove('opacity-100');
            content.classList.add('translate-y-full');
            setTimeout(() => modal.classList.add('hidden'), 300);
        };

        const getTodayDate = () => new Date().toISOString().split('T')[0];

        function renderUI() {
            document.getElementById('totalGlobal').innerText = formatRupiah(calculateGlobalTotal());
            const activeContainer = document.getElementById('activeList');
            activeContainer.innerHTML = '';

            if (appData.active.length === 0) {
                activeContainer.innerHTML = `
                    <div class="text-center p-8 bg-white dark:bg-slate-800 rounded-2xl border border-dashed border-slate-300 dark:border-slate-700 text-slate-500 dark:text-slate-400">
                        <div class="bg-slate-50 dark:bg-slate-900 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3">
                            <i class="ph-fill ph-users text-3xl text-slate-300 dark:text-slate-600"></i>
                        </div>
                        <p class="font-medium text-slate-600 dark:text-slate-300">Belum ada catatan.</p>
                        <p class="text-sm">Tambahkan nama teman di form atas.</p>
                    </div>`;
            } else {
                appData.active.forEach(person => {
                    const total = calculateTotal(person.items);
                    const isExpanded = expandedPersonId === person.id;
                    const showForm = activeAddFormId === person.id;

                    let itemsHtml = person.items.length === 0 
                        ? `<div class="text-center py-4 bg-slate-50 dark:bg-slate-900 rounded-xl border border-dashed border-slate-200 dark:border-slate-700 text-slate-400 text-sm">Tidak ada catatan bon</div>`
                        : `<div class="space-y-2 mb-4">` + person.items.map(item => `
                            <div class="flex justify-between items-center bg-white dark:bg-slate-800 p-3.5 rounded-xl border border-slate-100 dark:border-slate-700 shadow-sm">
                                <div class="flex flex-col">
                                    <span class="text-xs font-bold text-blue-500 dark:text-blue-400 mb-0.5"><i class="ph-bold ph-calendar-blank"></i> ${item.date}</span>
                                    <span class="text-slate-800 dark:text-slate-200 font-semibold text-sm capitalize">${item.name}</span>
                                </div>
                                <div class="flex items-center gap-4">
                                    <span class="font-bold text-slate-700 dark:text-slate-300">${formatRupiah(item.price)}</span>
                                    <button onclick="deleteItem('${person.id}', '${item.id}', event)" class="text-slate-300 hover:text-red-500 bg-red-50 dark:bg-red-900/20 dark:text-slate-500 p-1.5 rounded-lg transition-colors">
                                        <i class="ph-bold ph-trash"></i>
                                    </button>
                                </div>
                            </div>
                        `).join('') + `</div>`;

                    let formHtml = showForm 
                        ? `
                        <form onsubmit="addItem(event, '${person.id}')" class="mt-3 bg-blue-50/70 dark:bg-slate-900 p-3.5 rounded-xl border border-blue-100 dark:border-slate-700 relative">
                            <button type="button" onclick="toggleAddForm('${person.id}', event)" class="absolute -top-3 -right-2 bg-white dark:bg-slate-800 rounded-full p-1.5 shadow-md border border-slate-100 dark:border-slate-700 text-slate-500 dark:text-slate-400">
                                <i class="ph-bold ph-x text-sm"></i>
                            </button>
                            <div class="space-y-3">
                                <div class="flex gap-2">
                                    <input type="date" id="itemDate_${person.id}" value="${getTodayDate()}" class="w-[45%] bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 dark:text-white"/>
                                    <input type="text" id="itemName_${person.id}" placeholder="Pesanan (contoh: warteg)" class="flex-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 dark:text-white" required/>
                                </div>
                                <div class="flex gap-2">
                                    <div class="relative flex-1">
                                        <span class="absolute left-3 top-2.5 text-slate-500 text-sm font-bold">Rp</span>
                                        <!-- Perhatikan type text + inputmode numeric dan oninput trigger formatter otomatis -->
                                        <input type="text" inputmode="numeric" oninput="formatPriceInput(this)" id="itemPrice_${person.id}" placeholder="15.000" class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg pl-9 pr-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 dark:text-white" required/>
                                    </div>
                                    <button type="submit" class="bg-blue-600 dark:bg-blue-700 text-white px-5 py-2.5 rounded-lg text-sm font-bold shadow-md">Tambah</button>
                                </div>
                            </div>
                        </form>
                        `
                        : `
                        <button onclick="toggleAddForm('${person.id}', event)" class="w-full py-3 bg-white dark:bg-slate-800 border-2 border-dashed border-slate-300 dark:border-slate-600 text-slate-500 dark:text-slate-400 rounded-xl flex items-center justify-center gap-2 hover:border-blue-400 hover:text-blue-600 dark:hover:text-blue-400 transition-all font-semibold shadow-sm">
                            <i class="ph-bold ph-plus-circle text-lg"></i> Bon Baru
                        </button>
                        `;

                    const card = document.createElement('div');
                    card.className = "bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden";
                    card.innerHTML = `
                        <div onclick="toggleAccordion('${person.id}')" class="p-4 flex justify-between items-center cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-750 transition-colors">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full bg-blue-100 dark:bg-blue-900/50 flex items-center justify-center text-blue-600 dark:text-blue-400 font-bold text-lg">
                                    ${person.name.charAt(0).toUpperCase()}
                                </div>
                                <div class="flex flex-col">
                                    <h3 class="font-bold text-lg text-slate-800 dark:text-slate-100 leading-tight">${person.name}</h3>
                                    <span class="text-xs text-slate-400 mt-0.5">
                                        ${person.phone ? `<i class="ph-fill ph-whatsapp-logo text-emerald-500"></i> +${person.phone}` : 'Tanpa No. WA'}
                                    </span>
                                </div>
                            </div>
                            <div class="flex items-center gap-3">
                                <div class="text-right">
                                    <div class="text-[11px] text-slate-400 font-bold uppercase tracking-wide">Total</div>
                                    <div class="font-bold text-red-500 dark:text-red-400">${formatRupiah(total)}</div>
                                </div>
                                <div class="text-slate-400 transition-transform duration-300 ${isExpanded ? 'rotate-180' : ''}">
                                    <i class="ph-bold ph-caret-down text-xl"></i>
                                </div>
                            </div>
                        </div>
                        
                        <div class="accordion-content ${isExpanded ? 'expanded border-t border-slate-100 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-900/50' : ''}">
                            <div class="p-4">
                                ${itemsHtml}
                                ${formHtml}
                            </div>
                            <div class="p-4 flex gap-2 border-t border-slate-100 dark:border-slate-700 bg-white dark:bg-slate-800">
                                <button onclick="markAsPaid('${person.id}', event)" ${person.items.length === 0 ? 'disabled' : ''} class="flex-1 bg-white dark:bg-slate-800 border-2 border-emerald-500 text-emerald-600 dark:text-emerald-500 hover:bg-emerald-50 dark:hover:bg-emerald-900/20 disabled:opacity-40 disabled:border-slate-200 disabled:text-slate-400 py-2.5 rounded-xl text-sm font-bold flex items-center justify-center gap-2 transition-all">
                                    <i class="ph-bold ph-check-circle text-lg"></i> Lunas
                                </button>
                                <button onclick="shareWhatsApp('${person.id}', event)" ${person.items.length === 0 ? 'disabled' : ''} class="flex-1 bg-[#25D366] hover:bg-[#128C7E] text-white disabled:opacity-40 disabled:bg-slate-300 py-2.5 rounded-xl text-sm font-bold flex items-center justify-center gap-2 transition-all shadow-md">
                                    <i class="ph-bold ph-whatsapp-logo text-lg"></i> Kirim WA
                                </button>
                                <button onclick="deletePerson('${person.id}')" class="px-4 bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300 hover:text-red-500 hover:bg-red-50 py-2.5 rounded-xl transition-all">
                                    <i class="ph-bold ph-trash"></i>
                                </button>
                            </div>
                        </div>
                    `;
                    activeContainer.appendChild(card);
                });
            }

            const historyContainer = document.getElementById('historyList');
            historyContainer.innerHTML = '';
            if (appData.history.length === 0) {
                historyContainer.innerHTML = `<div class="text-center p-6 text-slate-400">Belum ada riwayat lunas.</div>`;
            } else {
                appData.history.forEach(history => {
                    historyContainer.innerHTML += `
                        <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 border border-emerald-100 dark:border-emerald-900 shadow-sm opacity-90">
                            <div class="flex justify-between items-center mb-2">
                                <div class="font-bold text-slate-700 dark:text-slate-200 flex items-center gap-2">
                                    <i class="ph-fill ph-check-circle text-emerald-500"></i> ${history.name}
                                </div>
                                <div class="text-xs text-slate-400">${history.clearedAt}</div>
                            </div>
                            <div class="text-sm text-slate-500 dark:text-slate-400 mb-2">Sebanyak ${history.items.length} item telah dilunasi.</div>
                            <div class="font-bold text-emerald-600 dark:text-emerald-400">Total: ${formatRupiah(history.total)}</div>
                        </div>
                    `;
                });
            }
        }

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeUI(isDark);
        }

        function updateThemeUI(isDark) {
            const icon = document.getElementById('themeIcon');
            const metaTheme = document.getElementById('themeColorMeta');
            if(isDark) {
                icon.classList.replace('ph-moon', 'ph-sun');
                metaTheme.setAttribute('content', '#1e293b'); // slate-800
            } else {
                icon.classList.replace('ph-sun', 'ph-moon');
                metaTheme.setAttribute('content', '#2563eb'); // blue-600
            }
        }

        // PWA Manifest Injector
        function setupPWA() {
            const manifest = {
                name: "Ngutang Pro",
                short_name: "Ngutang",
                start_url: ".",
                display: "standalone",
                background_color: "#f8fafc",
                theme_color: "#2563eb",
                icons: [{
                    src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E%3Crect width='256' height='256' fill='none'/%3E%3Crect x='32' y='48' width='192' height='160' rx='8' fill='%232563eb'/%3E%3Cpath d='M32 104h192' fill='none' stroke='%23fff' stroke-linecap='round' stroke-linejoin='round' stroke-width='16'/%3E%3C/svg%3E",
                    sizes: "192x192",
                    type: "image/svg+xml"
                }]
            };
            const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
            const pwaLink = document.createElement('link');
            pwaLink.rel = 'manifest';
            pwaLink.href = URL.createObjectURL(manifestBlob);
            document.head.appendChild(pwaLink);
        }

        // Tangkap event PWA Instal
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            // Tampilkan tombol instal di menu pengaturan
            document.getElementById('installBtn').classList.remove('hidden');
        });

        document.getElementById('installBtn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    document.getElementById('installBtn').classList.add('hidden');
                }
                deferredPrompt = null;
            }
            closeMenu();
        });

        // Init
        loadData();
        renderUI();
        setupPWA();
        updateThemeUI(document.documentElement.classList.contains('dark'));

    </script>
</body>
</html>
