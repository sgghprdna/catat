<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2563eb" id="themeColorMeta">
    <title>Ngutang</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 900: '#1e3a8a' }
                    }
                }
            }
        }
        
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        input[type="text"], input[type="number"], input[type="tel"], input[type="date"], input[type="password"] { font-size: 16px; }
        * { -webkit-tap-highlight-color: transparent; }
        
        .accordion-content { transition: max-height 0.4s ease-in-out, opacity 0.3s ease-in-out; max-height: 0; opacity: 0; overflow: hidden; }
        .accordion-content.expanded { max-height: 3500px; opacity: 1; overflow: visible; }
        
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .bottom-sheet-overlay { transition: opacity 0.3s ease; }
        .bottom-sheet-content { transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .hidden-sheet { pointer-events: none; }
        .hidden-sheet .bottom-sheet-overlay { opacity: 0; }
        .hidden-sheet .bottom-sheet-content { transform: translateY(100%); }

        .custom-checkbox { appearance: none; width: 24px; height: 24px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; border: 2px solid #cbd5e1; }
        .dark .custom-checkbox { border-color: #475569; }
        .custom-checkbox:checked { background-color: #2563eb; border-color: #2563eb; }
        .custom-checkbox:checked::after { content: '✓'; color: white; font-weight: bold; font-size: 14px; }
        
        .progress-striped { background-image: linear-gradient(45deg, rgba(255,255,255,.15) 25%, transparent 25%, transparent 50%, rgba(255,255,255,.15) 50%, rgba(255,255,255,.15) 75%, transparent 75%, transparent); background-size: 1rem 1rem; }

        .header-transition { transition: all 0.3s ease; }
        .header-shrink { padding-top: 1rem !important; padding-bottom: 0.75rem !important; }
        .header-shrink .header-title-area { margin-bottom: 0 !important; }
        .header-shrink .header-logo { width: 32px; height: 32px; padding: 4px; }
        .header-shrink .header-logo i { font-size: 1.25rem; }
        .header-shrink h1 { font-size: 1.125rem; }
        .header-shrink .header-amount { font-size: 1.5rem; line-height: 1.2; margin-top: 0.25rem; }

        .no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Privacy Mode Filter */
        body.privacy-on .money-value { filter: blur(5px); opacity: 0.7; pointer-events: none; user-select: none; transition: filter 0.3s ease; }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans pb-28 min-h-screen relative transition-colors duration-300">

    <header id="mainHeader" class="header-transition bg-gradient-to-br from-brand-600 to-brand-900 dark:from-slate-800 dark:to-slate-950 text-white pt-8 pb-6 px-5 shadow-lg rounded-b-3xl sticky top-0 z-20 transition-colors duration-300">
        <div class="max-w-md mx-auto">
            <div class="header-title-area flex justify-between items-start mb-4 transition-all">
                <div class="flex items-center gap-3">
                    <div class="header-logo bg-white/20 p-2 rounded-xl backdrop-blur-sm shadow-inner transition-all flex items-center justify-center">
                        <i class="ph ph-wallet text-2xl text-white"></i>
                    </div>
                    <div><h1 class="text-xl font-bold tracking-tight transition-all">Ngutang</h1></div>
                </div>
                <div class="flex items-center gap-1">
                    <button onclick="togglePrivacyMode()" class="p-2 hover:bg-white/10 rounded-lg transition-colors">
                        <i id="privacyIcon" class="ph-bold ph-eye-closed text-xl sm:text-2xl"></i>
                    </button>
                    <button onclick="toggleTheme()" class="p-2 hover:bg-white/10 rounded-lg transition-colors">
                        <i id="themeIcon" class="ph-fill ph-moon text-xl sm:text-2xl"></i>
                    </button>
                    <button onclick="openSheet('settingsSheet')" class="p-2 hover:bg-white/10 rounded-lg transition-colors">
                        <i class="ph ph-dots-three-outline-vertical text-xl sm:text-2xl"></i>
                    </button>
                </div>
            </div>
            
            <div id="headerDataContainer" class="mt-2 transition-all relative">
                <!-- Diisi otomatis oleh JavaScript -->
            </div>
        </div>
    </header>

    <div class="max-w-md mx-auto px-4 mt-6 mb-3 overflow-x-auto no-scrollbar">
        <div class="flex bg-slate-200/70 dark:bg-slate-800 p-1.5 rounded-xl shadow-inner transition-colors duration-300 min-w-max gap-1">
            <button onclick="switchTab('ngutangin')" id="tabBtn-ngutangin" class="px-4 py-2 text-[11px] sm:text-sm font-bold rounded-lg transition-all flex-1">Ngutangin</button>
            <button onclick="switchTab('utangSaya')" id="tabBtn-utangSaya" class="px-4 py-2 text-[11px] sm:text-sm font-bold rounded-lg transition-all flex-1">Utang Saya</button>
            <button onclick="switchTab('history')" id="tabBtn-history" class="px-4 py-2 text-[11px] sm:text-sm font-bold rounded-lg transition-all flex-1">Riwayat</button>
        </div>
    </div>

    <!-- Area Pencarian & Filter -->
    <div id="searchSortArea" class="max-w-md mx-auto px-4 mb-5 flex gap-2">
        <div class="relative flex-1">
            <span class="absolute left-3 top-2.5 text-slate-400"><i class="ph-bold ph-magnifying-glass"></i></span>
            <input type="text" id="searchInput" oninput="renderUI()" placeholder="Cari nama..." class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl pl-9 pr-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 text-slate-800 dark:text-slate-100 transition-colors shadow-sm" autocomplete="off">
        </div>
        <select id="sortSelect" onchange="renderUI()" class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-2 py-2.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-brand-500 text-slate-700 dark:text-slate-200 shadow-sm outline-none">
            <option value="newest">Terbaru</option>
            <option value="largest">Terbesar</option>
            <option value="az">A - Z</option>
        </select>
    </div>

    <main class="max-w-md mx-auto px-4 space-y-5 relative">
        <!-- Tab: Main List (Ngutangin & Utang Saya) -->
        <div id="tab-main" class="tab-content active space-y-4">
            <div id="mainList" class="space-y-4"></div>
        </div>

        <!-- Tab: History -->
        <div id="tab-history" class="tab-content space-y-4">
            <div class="flex items-center justify-between mb-2">
                <div class="flex-1 flex items-center bg-white dark:bg-slate-800 p-1.5 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm transition-colors duration-300">
                    <div class="pl-3 text-slate-400"><i class="ph-bold ph-funnel"></i></div>
                    <select id="historyFilter" onchange="renderHistory()" class="w-full bg-transparent border-none text-sm font-medium focus:ring-0 text-slate-700 dark:text-slate-200 py-2 px-2 outline-none appearance-none">
                        <option value="all" class="text-slate-800 bg-white dark:bg-slate-700 dark:text-white">Semua Riwayat</option>
                    </select>
                    <div class="pr-3 text-slate-400 pointer-events-none"><i class="ph-bold ph-caret-down text-sm"></i></div>
                </div>
                <button onclick="clearHistory()" class="ml-2 bg-red-50 text-red-600 dark:bg-red-900/30 dark:text-red-400 p-2.5 rounded-xl border border-red-100 dark:border-red-800 hover:bg-red-100 transition-colors">
                    <i class="ph-bold ph-trash"></i>
                </button>
            </div>
            <div id="historyList" class="space-y-4"></div>
        </div>
    </main>

    <!-- Floating Action Button -->
    <button id="mainFabBtn" onclick="openSheet('addPersonSheet')" class="fixed bottom-6 right-6 w-14 h-14 bg-brand-600 hover:bg-brand-700 active:bg-brand-800 text-white rounded-full shadow-[0_8px_20px_rgba(37,99,235,0.4)] flex items-center justify-center transition-transform transform hover:scale-105 z-30">
        <i class="ph-bold ph-user-plus text-2xl"></i>
    </button>

    <!-- Sheet: Add Person -->
    <div id="addPersonSheet" class="fixed inset-0 z-50 flex items-end justify-center hidden-sheet">
        <div class="bottom-sheet-overlay absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onclick="closeSheet('addPersonSheet')"></div>
        <div class="bottom-sheet-content relative w-full max-w-md bg-white dark:bg-slate-800 rounded-t-3xl p-6 shadow-2xl transition-colors duration-300">
            <div class="w-12 h-1.5 bg-slate-200 dark:bg-slate-700 rounded-full mx-auto mb-6"></div>
            <h3 class="text-xl font-bold mb-1 flex items-center gap-2 text-slate-800 dark:text-white"><i class="ph-fill ph-user-plus text-brand-500"></i> Tambah Orang</h3>
            <p id="addPersonSubtitle" class="text-xs text-slate-500 dark:text-slate-400 mb-5">Masuk ke daftar: Ngutangin</p>
            <form onsubmit="addPerson(event)" class="space-y-3">
                <input type="text" id="newPersonName" placeholder="Nama Orang (contoh: Budi)" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3.5 focus:outline-none focus:ring-2 focus:ring-brand-500 text-slate-800 dark:text-slate-100 transition-all" required autocomplete="off"/>
                <div class="relative flex items-center">
                    <span class="absolute left-4 top-3.5 text-slate-400"><i class="ph-fill ph-whatsapp-logo text-lg"></i></span>
                    <input type="tel" id="newPersonPhone" placeholder="No. WA (Opsional: 0812...)" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl pl-11 pr-14 py-3.5 focus:outline-none focus:ring-2 focus:ring-brand-500 text-slate-800 dark:text-slate-100 transition-all" autocomplete="off"/>
                    <button type="button" onclick="openContactPicker()" class="absolute right-2 p-1.5 bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-lg hover:bg-brand-100 hover:text-brand-600 dark:hover:bg-brand-900/50 dark:hover:text-brand-400 transition-colors flex items-center justify-center">
                        <i class="ph-fill ph-address-book text-xl"></i>
                    </button>
                </div>
                <div class="relative">
                    <span class="absolute left-4 top-3.5 text-slate-400"><i class="ph-fill ph-note text-lg"></i></span>
                    <input type="text" id="newPersonNotes" placeholder="Catatan / No. Rek. (Opsional)" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl pl-11 pr-4 py-3.5 focus:outline-none focus:ring-2 focus:ring-brand-500 text-slate-800 dark:text-slate-100 transition-all" autocomplete="off"/>
                </div>
                <button type="submit" class="w-full mt-2 bg-brand-600 hover:bg-brand-700 text-white px-5 py-4 rounded-xl font-bold shadow-md transition-colors text-lg">Simpan</button>
            </form>
        </div>
    </div>

    <!-- Sheet: Add Bulk Items -->
    <div id="addItemSheet" class="fixed inset-0 z-50 flex items-end justify-center hidden-sheet">
        <div class="bottom-sheet-overlay absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onclick="closeSheet('addItemSheet')"></div>
        <div class="bottom-sheet-content relative w-full max-w-md bg-white dark:bg-slate-800 rounded-t-3xl p-6 shadow-2xl transition-colors duration-300 max-h-[90vh] flex flex-col">
            <div class="w-12 h-1.5 bg-slate-200 dark:bg-slate-700 rounded-full mx-auto mb-6 shrink-0"></div>
            <h3 class="text-xl font-bold mb-1 flex items-center gap-2 text-slate-800 dark:text-white shrink-0"><i class="ph-fill ph-receipt text-brand-500"></i> Catat Bon</h3>
            <p id="addItemPersonName" class="text-sm text-slate-500 dark:text-slate-400 mb-4 shrink-0">Untuk: -</p>
            
            <div class="flex-1 overflow-y-auto no-scrollbar pb-4 space-y-4">
                <input type="hidden" id="addItemPersonId">
                <div class="flex gap-3">
                    <div class="relative flex-1">
                        <span class="absolute left-3 top-3.5 text-slate-400"><i class="ph-fill ph-calendar-blank"></i> Tgl Bon</span>
                        <input type="date" id="globalItemDate" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl pl-20 pr-2 py-3.5 text-sm focus:ring-2 focus:ring-brand-500 text-slate-800 dark:text-slate-100" required/>
                    </div>
                    <div class="relative flex-1">
                        <span class="absolute left-3 top-3.5 text-slate-400"><i class="ph-fill ph-clock-countdown"></i> Tenggat</span>
                        <input type="date" id="globalItemDueDate" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl pl-20 pr-2 py-3.5 text-sm focus:ring-2 focus:ring-brand-500 text-slate-500 dark:text-slate-400" />
                    </div>
                </div>

                <div class="w-full h-px bg-slate-200 dark:bg-slate-700"></div>
                
                <div id="bulkItemsContainer" class="space-y-3">
                    <!-- Dinamis -->
                </div>

                <button type="button" onclick="addBulkItemRow()" class="w-full py-3 bg-slate-100 dark:bg-slate-900 border border-dashed border-slate-300 dark:border-slate-700 rounded-xl text-slate-600 dark:text-slate-400 font-bold text-sm hover:bg-slate-200 transition-colors flex items-center justify-center gap-2">
                    <i class="ph-bold ph-plus"></i> Tambah Item Lain
                </button>
            </div>

            <div class="shrink-0 pt-3 bg-white dark:bg-slate-800 border-t border-slate-100 dark:border-slate-700 mt-2">
                <button onclick="saveBulkItems()" class="w-full bg-brand-600 hover:bg-brand-700 text-white px-5 py-4 rounded-xl font-bold shadow-md transition-colors text-lg">Simpan Semua</button>
            </div>
        </div>
    </div>

    <!-- Sheet: Payment (Cicil) -->
    <div id="paymentSheet" class="fixed inset-0 z-50 flex items-end justify-center hidden-sheet">
        <div class="bottom-sheet-overlay absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onclick="closeSheet('paymentSheet')"></div>
        <div class="bottom-sheet-content relative w-full max-w-md bg-white dark:bg-slate-800 rounded-t-3xl p-6 shadow-2xl transition-colors duration-300">
            <div class="w-12 h-1.5 bg-slate-200 dark:bg-slate-700 rounded-full mx-auto mb-6"></div>
            <h3 class="text-xl font-bold mb-1 text-slate-800 dark:text-white">Bayar / Cicil</h3>
            <p id="payItemTitle" class="text-sm font-medium text-slate-500 dark:text-slate-400 mb-4 bg-slate-50 dark:bg-slate-900/50 p-3 rounded-lg border border-slate-200 dark:border-slate-700 truncate"></p>
            
            <form onsubmit="processPayment(event)" class="space-y-4">
                <input type="hidden" id="payPersonId">
                <input type="hidden" id="payItemId">
                <input type="hidden" id="payMaxAmount">
                
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Nominal Uang</label>
                    <div class="relative">
                        <span class="absolute left-4 top-3.5 text-brand-600 dark:text-brand-400 font-bold">Rp</span>
                        <input type="text" inputmode="numeric" oninput="formatPriceInput(this); calculatePaymentFeedback();" id="payAmountInput" class="w-full bg-brand-50 dark:bg-slate-900 border-2 border-brand-200 dark:border-brand-700 rounded-xl pl-12 pr-4 py-3.5 text-2xl font-bold focus:ring-brand-500 text-brand-700 dark:text-brand-300 transition-colors" required autocomplete="off"/>
                    </div>
                    
                    <div id="paymentFeedback" class="mt-2 min-h-[20px] text-sm"></div>

                    <div class="flex justify-between items-center mt-3 gap-2">
                        <span class="text-xs text-slate-400 shrink-0">Cepat:</span>
                        <div class="flex gap-2 flex-1 overflow-x-auto pb-1 no-scrollbar">
                            <button type="button" onclick="setQuickPayment(10000)" class="text-xs font-bold bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 whitespace-nowrap">10rb</button>
                            <button type="button" onclick="setHalfPayment()" class="text-xs font-bold bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 whitespace-nowrap">Setengah</button>
                            <button type="button" onclick="setFullPayment()" id="btnSetFull" class="text-xs font-bold bg-brand-100 dark:bg-brand-900/40 text-brand-600 dark:text-brand-300 px-3 py-2 rounded-lg border border-brand-200 dark:border-brand-700 whitespace-nowrap">Lunas</button>
                        </div>
                    </div>
                </div>
                
                <button type="submit" class="w-full mt-2 bg-brand-600 hover:bg-brand-700 text-white px-5 py-4 rounded-xl font-bold shadow-md flex justify-center items-center gap-2 text-lg">
                    <i class="ph-bold ph-check-circle text-xl"></i> Konfirmasi Pembayaran
                </button>
            </form>
        </div>
    </div>

    <!-- Sheet: Settings -->
    <div id="settingsSheet" class="fixed inset-0 z-50 flex items-end justify-center hidden-sheet">
        <div class="bottom-sheet-overlay absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onclick="closeSheet('settingsSheet')"></div>
        <div class="bottom-sheet-content relative w-full max-w-md bg-white dark:bg-slate-800 rounded-t-3xl p-6 shadow-2xl transition-colors duration-300">
            <div class="w-12 h-1.5 bg-slate-200 dark:bg-slate-700 rounded-full mx-auto mb-6"></div>
            <h3 class="text-xl font-bold text-slate-800 dark:text-slate-100 mb-5">Pengaturan</h3>
            
            <div class="space-y-3">
                <button id="installBtn" class="hidden w-full flex items-center gap-4 p-4 bg-purple-50 dark:bg-purple-900/30 border border-purple-100 dark:border-purple-800 rounded-2xl text-purple-700 dark:text-purple-400 hover:bg-purple-100 text-left transition-colors">
                    <i class="ph-fill ph-download text-3xl"></i>
                    <div><div class="font-bold">Instal Aplikasi</div><div class="text-xs opacity-80 mt-0.5">Tambahkan ke layar utama HP</div></div>
                </button>

                <div class="grid grid-cols-2 gap-3">
                    <button onclick="exportData()" class="flex flex-col items-center justify-center p-4 bg-blue-50 dark:bg-brand-900/30 border border-blue-100 dark:border-brand-800 rounded-2xl text-brand-700 dark:text-brand-400 hover:bg-blue-100 transition-colors text-center">
                        <i class="ph-bold ph-export text-2xl mb-1"></i>
                        <div class="font-bold text-sm">Backup (Export)</div>
                    </button>
                    <label class="flex flex-col items-center justify-center p-4 bg-emerald-50 dark:bg-emerald-900/30 border border-emerald-100 dark:border-emerald-800 rounded-2xl text-emerald-700 dark:text-emerald-400 hover:bg-emerald-100 cursor-pointer transition-colors text-center">
                        <i class="ph-bold ph-import text-2xl mb-1"></i>
                        <div class="font-bold text-sm">Restore (Import)</div>
                        <input type="file" id="importFile" accept=".json" class="hidden" onchange="importData(event)" />
                    </label>
                </div>
                
                <button onclick="triggerClearData()" class="w-full flex items-center justify-center gap-2 p-4 bg-red-50 dark:bg-red-900/30 border border-red-100 dark:border-red-900 rounded-2xl text-red-600 dark:text-red-400 hover:bg-red-100 text-center mt-2 transition-colors">
                    <i class="ph-bold ph-trash text-xl"></i><div class="font-bold text-sm">Hapus Semua Data</div>
                </button>
            </div>
        </div>
    </div>

    <div id="customDialogOverlay" class="fixed inset-0 bg-slate-900/70 z-[100] hidden flex items-center justify-center p-4 backdrop-blur-sm opacity-0 transition-opacity">
        <div id="customDialogBox" class="bg-white dark:bg-slate-800 w-full max-w-sm rounded-3xl p-6 shadow-2xl transform scale-95 transition-all duration-300">
            <h3 id="dialogTitle" class="text-xl font-bold text-slate-800 dark:text-white mb-2">Konfirmasi</h3>
            <div id="dialogMessage" class="text-slate-600 dark:text-slate-300 mb-6 leading-relaxed text-sm break-words">Pesan</div>
            <div class="flex gap-3 justify-end">
                <button id="dialogBtnCancel" onclick="closeDialog()" class="px-5 py-2.5 rounded-xl font-bold text-slate-500 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-700 transition-colors">Batal</button>
                <button id="dialogBtnConfirm" class="px-5 py-2.5 rounded-xl font-bold bg-brand-600 text-white hover:bg-brand-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">Ya</button>
            </div>
        </div>
    </div>

    <script>
        const defaultData = { ngutangin: [], utangSaya: [], history: [] };
        let appData = defaultData;
        
        // Privacy mode on by default
        const defaultSettings = { lastTab: 'ngutangin', privacyMode: true };
        let settings = defaultSettings;

        let expandedPersonId = null;
        let selectedCheckboxes = {}; 
        let currentTab = 'ngutangin';
        
        let privacyTimer;
        const PRIVACY_TIMEOUT = 20000; // 20 seconds inactivity

        const formatRupiah = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num || 0);
        const formatNumber = (num) => new Intl.NumberFormat('id-ID').format(num || 0);
        const getRawNumber = (str) => parseInt(str.toString().replace(/[^0-9-]/g, '')) || 0;
        const getTodayDate = () => new Date().toISOString().split('T')[0];
        const getShortDate = (dString) => { const d = new Date(dString); return `${d.getDate()}/${d.getMonth() + 1}`; };
        
        function formatPriceInput(input) {
            let val = input.value.replace(/[^0-9]/g, '');
            input.value = val ? formatNumber(val) : '';
        }

        function getCurrentTimeStr() {
            const now = new Date();
            return `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
        }

        function triggerConfetti() {
            if (typeof confetti === 'function') confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#2563eb', '#10b981', '#f59e0b', '#ef4444', '#a855f7'] });
        }

        function getAvatarColor(name) {
            const colors = [
                'from-blue-400 to-blue-600 text-white', 'from-emerald-400 to-emerald-600 text-white',
                'from-red-400 to-red-600 text-white', 'from-purple-400 to-purple-600 text-white',
                'from-orange-400 to-orange-600 text-white', 'from-teal-400 to-teal-600 text-white',
                'from-pink-400 to-pink-600 text-white', 'from-indigo-400 to-indigo-600 text-white'
            ];
            let hash = 0;
            for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
            return colors[Math.abs(hash) % colors.length];
        }

        function loadData() {
            try {
                const stored = localStorage.getItem('ngutangDataV3');
                if (stored) {
                    appData = JSON.parse(stored);
                } else {
                    const oldStored = localStorage.getItem('ngutangDataV2') || localStorage.getItem('ngutangData');
                    if (oldStored) {
                        const oldApp = JSON.parse(oldStored);
                        appData.ngutangin = oldApp.ngutangin || oldApp.active || [];
                        appData.utangSaya = oldApp.utangSaya || [];
                        appData.history = oldApp.history || [];
                    }
                }
                const storedSettings = localStorage.getItem('ngutangSettings');
                if (storedSettings) settings = {...defaultSettings, ...JSON.parse(storedSettings)};
                // Ensure default true for privacy on load
                if (!('privacyMode' in (JSON.parse(storedSettings || '{}')))) settings.privacyMode = true;
            } catch (e) { appData = defaultData; }
        }

        function resetPrivacyTimer() {
            clearTimeout(privacyTimer);
            // Only start timer if privacy mode is currently off (eye open)
            if (!settings.privacyMode) {
                privacyTimer = setTimeout(() => {
                    if (!settings.privacyMode) {
                        togglePrivacyMode(true); // Force it on after timeout
                    }
                }, PRIVACY_TIMEOUT);
            }
        }

        function togglePrivacyMode(forceState = null) {
            if (forceState !== null) {
                settings.privacyMode = forceState;
            } else {
                settings.privacyMode = !settings.privacyMode;
            }
            saveSettings();
            
            const icon = document.getElementById('privacyIcon');
            if(settings.privacyMode) { 
                document.body.classList.add('privacy-on'); 
                icon.classList.replace('ph-eye', 'ph-eye-closed'); 
                clearTimeout(privacyTimer); // Stop timer when closed
            } else { 
                document.body.classList.remove('privacy-on'); 
                icon.classList.replace('ph-eye-closed', 'ph-eye');

        async function openContactPicker() {

                showAlert('Tidak Didukung', 'Browser Anda tidak mendukung ambil kontak otomatis. Fitur ini hanya didukung di Google Chrome Android.', true);
                return;
            }
            try {
                const contacts = await navigator.contacts.select(['name', 'tel'], { multiple: false });
                if (contacts && contacts.length > 0) {
                    const contact = contacts[0];
                    if (contact.name && contact.name.length > 0) {
                        document.getElementById('newPersonName').value = contact.name[0];
                    }
                    if (contact.tel && contact.tel.length > 0) {
                        // Bersihkan spasi/karakter aneh dan sesuaikan ke format lokal 08...
                        let phone = contact.tel[0].replace(/[^0-9+]/g, '');
                        if(phone.startsWith('+62')) phone = '0' + phone.substring(3);
                        else if(phone.startsWith('62')) phone = '0' + phone.substring(2);
                        document.getElementById('newPersonPhone').value = phone;
                    }
                }
            } catch (ex) {
                console.log('Ambil kontak dibatalkan atau error:', ex);
            }
        }

        function setQuickPayment(amount) { const input = document.getElementById('payAmountInput'); input.value = formatNumber(amount); calculatePaymentFeedback(); }
        function setHalfPayment() { const max = document.getElementById('payMaxAmount').value; setQuickPayment(Math.ceil(max / 2)); }

        function calculatePaymentFeedback() {
            const input = document.getElementById('payAmountInput');
            const max = parseInt(document.getElementById('payMaxAmount').value) || 0;
            const payAmount = getRawNumber(input.value);
            const feedbackEl = document.getElementById('paymentFeedback');
            if (!payAmount) { feedbackEl.innerHTML = ''; return; }
            
            const diff = payAmount - max;
            if (diff > 0) feedbackEl.innerHTML = `<span class="text-orange-500 dark:text-orange-400 font-bold tracking-tight">⚠️ Kembalian: ${formatRupiah(diff)}</span>`;
            else if (diff < 0) feedbackEl.innerHTML = `<span class="text-brand-600 dark:text-brand-400 font-medium">Sisa utang nanti: ${formatRupiah(Math.abs(diff))}</span>`;
            else feedbackEl.innerHTML = `<span class="text-emerald-600 dark:text-emerald-400 font-bold">Lunas Pas!</span>`;
        }

        function processPayment(e) {
            e.preventDefault();
            const personId = document.getElementById('payPersonId').value;
            const itemId = document.getElementById('payItemId').value;
            const payAmount = getRawNumber(document.getElementById('payAmountInput').value);
            
            const { person, sourceList } = findPersonById(personId);
            if (!person || payAmount <= 0) return;
            const itemIndex = person.items.findIndex(i => i.id === itemId);
            if (itemIndex === -1) return;
            const item = person.items[itemIndex];

            const actualPaymentToDebt = Math.min(payAmount, item.remainingPrice);
            const changeAmount = payAmount > item.remainingPrice ? payAmount - item.remainingPrice : 0;
            
            if(!item.paymentHistory) item.paymentHistory = [];
            item.paymentHistory.push(actualPaymentToDebt);

            recordHistoryEvent(person, [{ name: item.name, paidAmount: actualPaymentToDebt }], actualPaymentToDebt, item.remainingPrice <= actualPaymentToDebt, changeAmount, sourceList);

            item.paidAmount += actualPaymentToDebt;
            item.remainingPrice -= actualPaymentToDebt;

            let wasFullyPaid = false;
            if (item.remainingPrice <= 0) {
                person.items.splice(itemIndex, 1);
                wasFullyPaid = true;
                if (selectedCheckboxes[personId]) selectedCheckboxes[personId] = selectedCheckboxes[personId].filter(id => id !== itemId);
            }

            closeSheet('paymentSheet'); saveData();
            if (wasFullyPaid) triggerConfetti();
            if (changeAmount > 0) showAlert("Transaksi Selesai", `Tagihan lunas.\n\nJangan lupa ada kembalian sebesar:\n${formatRupiah(changeAmount)}`, true);
        }

        function paySelectedItems(personId, event) {
            event.stopPropagation();
            const { person, sourceList } = findPersonById(personId);
            const selectedIds = selectedCheckboxes[personId] || [];
            if (selectedIds.length === 0) return;
            
            const totalToPay = selectedIds.reduce((sum, id) => sum + person.items.find(i=>i.id===id).remainingPrice, 0);

            showConfirm("Lunas Terpilih?", `Lunasi item terpilih sejumlah ${formatRupiah(totalToPay)}?`, () => {
                let paidItemsInfo = [];
                selectedIds.forEach(itemId => {
                    const itemIndex = person.items.findIndex(i => i.id === itemId);
                    if (itemIndex > -1) {
                        const item = person.items[itemIndex];
                        paidItemsInfo.push({ name: item.name, paidAmount: item.remainingPrice });
                        item.paidAmount += item.remainingPrice;
                        item.remainingPrice = 0;
                    }
                });

                recordHistoryEvent(person, paidItemsInfo, totalToPay, true, 0, sourceList);
                person.items = person.items.filter(i => !selectedIds.includes(i.id));
                selectedCheckboxes[personId] = [];
                triggerConfetti(); saveData();
            }, "Lunaskan", "bg-emerald-500 hover:bg-emerald-600");
        }

            event.stopPropagation();

            let totalSisa = 0; let message = '';
            person.items.forEach((item) => {

                if(item.paymentHistory && item.paymentHistory.length > 0) message += `Sisa = Rp ${formatNumber(item.remainingPrice)}\n`;
            });
            message += `\n= Total: Rp ${formatNumber(totalSisa)}`;

            const encodedMessage = encodeURIComponent(message);
            const whatsappUrl = person.phone ? `https://wa.me/${person.phone}?text=${encodedMessage}` : `https://wa.me/?text=${encodedMessage}`;
            window.open(whatsappUrl, '_blank');

        function renderUI() {
            const container = document.getElementById('mainList');
            container.innerHTML = '';

            let listToRender = [...getCurrentList()];
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            if(query) listToRender = listToRender.filter(p => p.name.toLowerCase().includes(query));

            const sortVal = document.getElementById('sortSelect').value;
            if(sortVal === 'az') listToRender.sort((a,b) => a.name.localeCompare(b.name));
            else if (sortVal === 'largest') listToRender.sort((a,b) => calculatePersonDebt(b) - calculatePersonDebt(a));

            const todayStr = getTodayDate();

            if (listToRender.length === 0) {
                container.innerHTML = `<div class="flex flex-col items-center justify-center p-10 bg-white dark:bg-slate-800 rounded-2xl border border-dashed border-slate-300 dark:border-slate-700 text-slate-400"><i class="ph-fill ph-users text-5xl mb-3 text-slate-300 dark:text-slate-600"></i><p class="font-medium text-slate-500 dark:text-slate-400 text-center text-sm">Tidak ada catatan ditemukan.<br>Mulai dengan klik + di bawah.</p></div>`;
            } else {
                listToRender.forEach(person => {
                    let personTotalDebt = 0; let personTotalPaid = 0; let personTotalOriginal = 0; let activeInstallments = []; 
                    person.items.forEach(i => {
                        personTotalDebt += i.remainingPrice; personTotalPaid += i.paidAmount; personTotalOriginal += i.originalPrice;
                        if ((i.paymentHistory && i.paymentHistory.length > 0) && i.remainingPrice > 0) activeInstallments.push(i.name);
                    });
                    
                    const isExpanded = expandedPersonId === person.id;
                    const selectedIds = selectedCheckboxes[person.id] || [];
                    const selectedTotal = selectedIds.reduce((sum, id) => sum + person.items.find(i=>i.id===id).remainingPrice, 0);
                    let progressPercent = personTotalOriginal > 0 ? (personTotalPaid / personTotalOriginal) * 100 : 0;
                    const bgAvatar = getAvatarColor(person.name);

                    let installmentHtml = activeInstallments.length > 0 && !isExpanded ? `<div class="text-[11px] text-brand-600 dark:text-brand-400 mt-1 flex items-center gap-1 font-medium truncate max-w-[200px]"><i class="ph-bold ph-arrows-clockwise"></i> Dicicil: ${activeInstallments.join(', ')}</div>` : '';

                    let itemsHtml = person.items.length === 0 ? `<div class="text-center py-5 bg-slate-50/50 dark:bg-slate-900/30 rounded-xl border border-dashed border-slate-300 dark:border-slate-700 text-slate-400 text-sm italic">Belum ada catatan bon</div>` : `<div class="space-y-3 mb-4">` + person.items.map(item => {
                        const isChecked = selectedIds.includes(item.id);
                        const hasHistory = item.paymentHistory && item.paymentHistory.length > 0;
                        const historyText = hasHistory ? item.paymentHistory.map(n => formatNumber(n)).join(', ') : '';
                        const isLate = item.dueDate && item.dueDate < todayStr;
                        
                        return `
                        <div class="flex bg-white dark:bg-slate-800 p-3 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm relative transition-all cursor-pointer hover:border-brand-300 dark:hover:border-brand-700" onclick="toggleCheckbox('${person.id}', '${item.id}')">
                            <div class="flex-shrink-0 pt-1 pr-3"><input type="checkbox" class="custom-checkbox" ${isChecked ? 'checked' : ''} onclick="event.stopPropagation(); toggleCheckbox('${person.id}', '${item.id}')"></div>
                            <div class="flex-1 min-w-0">
                                <div class="flex justify-between items-start mb-1">
                                    <h4 class="font-bold text-sm sm:text-base text-slate-800 dark:text-slate-200 truncate pr-2">${item.name} ${isLate ? '<span class="ml-1 text-[9px] uppercase font-bold text-red-600 bg-red-100 dark:bg-red-900/40 px-1 py-0.5 rounded">Telat</span>' : ''}</h4>
                                    <span class="text-[11px] font-bold text-brand-600 dark:text-brand-400 shrink-0">${item.date}</span>
                                </div>
                                <div class="flex justify-between items-end">
                                    <div class="flex flex-col">
                                        ${hasHistory ? `<span class="text-[10px] text-slate-400 line-through mb-0.5 money-value">Rp ${formatNumber(item.originalPrice)}</span><span class="text-[9px] text-slate-500 italic mb-0.5 money-value">Riwayat cicil: ${historyText}</span>` : ''}
                                        <span class="font-black text-slate-800 dark:text-slate-100 text-[15px] sm:text-lg money-value tracking-tight">Rp ${formatNumber(item.remainingPrice)}</span>
                                    </div>
                                    <div class="flex gap-2" onclick="event.stopPropagation()">
                                        <button onclick="triggerPayment('${person.id}', '${item.id}', event)" class="bg-brand-50 hover:bg-brand-100 text-brand-600 dark:bg-brand-900/30 dark:text-brand-400 dark:hover:bg-brand-900/50 h-8 w-8 sm:h-9 sm:w-9 rounded-lg flex items-center justify-center transition-colors"><i class="ph-bold ph-wallet text-lg"></i></button>
                                        <button onclick="triggerDeleteItem('${person.id}', '${item.id}', event)" class="bg-red-50 hover:bg-red-100 text-red-500 dark:bg-red-900/20 dark:text-red-400 dark:hover:bg-red-900/40 h-8 w-8 sm:h-9 sm:w-9 rounded-lg flex items-center justify-center transition-colors"><i class="ph-bold ph-trash text-lg"></i></button>
                                    </div>
                                </div>
                            </div>
                        </div>`;
                    }).join('') + `</div>`;

                    const notesHtml = person.notes ? `<div class="text-[11px] text-slate-500 dark:text-slate-400 mt-1 mb-2 flex items-center justify-between gap-2 bg-slate-50 dark:bg-slate-900/50 p-2 rounded-lg border border-slate-100 dark:border-slate-800"><div class="flex items-center gap-1 overflow-hidden"><i class="ph-fill ph-note shrink-0"></i> <span class="truncate">${person.notes}</span></div><button onclick="copyNotes('${person.id}', event)" class="shrink-0 bg-slate-200 hover:bg-slate-300 dark:bg-slate-700 dark:hover:bg-slate-600 p-1.5 rounded transition-colors text-slate-600 dark:text-slate-300 flex items-center justify-center"><i class="ph-bold ph-copy"></i></button></div>` : '';

                    const card = document.createElement('div');
                    card.className = "bg-white dark:bg-slate-800 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden";
                    card.innerHTML = `
                        <div onclick="toggleAccordion('${person.id}')" class="p-4 relative cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800/80 transition-colors select-none">
                            <div class="flex justify-between items-start z-10 relative">
                                <div class="flex items-center gap-3">
                                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-br ${bgAvatar} flex items-center justify-center font-extrabold text-xl shadow-inner shrink-0">${person.name.charAt(0).toUpperCase()}</div>
                                    <div class="flex flex-col">
                                        <h3 class="font-bold text-[17px] text-slate-800 dark:text-slate-100 leading-tight">${person.name}</h3>
                                        <span class="text-[11px] text-slate-400 mt-0.5 flex items-center gap-1"><i class="ph-fill ph-whatsapp-logo"></i> ${person.phone ? `+${person.phone}` : 'Tanpa No. WA'}</span>
                                        ${installmentHtml}
                                    </div>
                                </div>
                                <div class="flex flex-col items-end gap-1">
                                    <div class="text-right">
                                        <div class="font-black text-red-500 dark:text-red-400 text-[15px] money-value tracking-tight">${formatNumber(personTotalDebt)}</div>
                                    </div>
                                    <div class="text-slate-300 dark:text-slate-500 transition-transform duration-300 ${isExpanded ? 'rotate-180' : ''}"><i class="ph-bold ph-caret-up text-lg"></i></div>
                                </div>
                            </div>
                            ${personTotalOriginal > 0 ? `<div class="absolute bottom-0 left-0 right-0 h-1 bg-slate-100 dark:bg-slate-700"><div class="h-full bg-emerald-500 progress-striped transition-all duration-700" style="width: ${progressPercent}%"></div></div>` : ''}
                        </div>
                        
                        <div class="accordion-content ${isExpanded ? 'expanded border-t border-slate-100 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/40' : ''}">
                            <div class="p-4 pt-4 pb-2">
                                ${notesHtml}
                                <div class="flex justify-between items-center my-3">
                                    <span class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Daftar Tagihan</span>
                                    <button onclick="triggerAddBulkItem('${person.id}', '${person.name}', event)" class="bg-slate-100 text-brand-700 dark:bg-slate-800 dark:text-brand-400 hover:bg-slate-200 dark:hover:bg-slate-700 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 transition-colors border border-slate-200 dark:border-slate-700"><i class="ph-bold ph-plus"></i> Bon Baru</button>
                                </div>
                                ${itemsHtml}
                            </div>
                            <div class="p-4 flex gap-2 border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-800">
                                <button onclick="paySelectedItems('${person.id}', event)" ${selectedIds.length === 0 ? 'disabled' : ''} class="flex-1 bg-slate-100 text-slate-400 dark:bg-slate-900/50 dark:text-slate-500 border border-slate-200 dark:border-slate-700 disabled:opacity-50 hover:bg-emerald-50 hover:text-emerald-700 dark:hover:bg-emerald-900/30 dark:hover:text-emerald-400 hover:border-emerald-200 dark:hover:border-emerald-800 py-3 rounded-xl text-sm font-bold flex flex-col items-center justify-center transition-all">
                                    <span class="flex items-center gap-1"><i class="ph-bold ph-check-square-offset"></i> Lunas Terpilih ${selectedTotal > 0 ? `<span class="money-value">(${formatNumber(selectedTotal)})</span>` : ''}</span>
                                </button>
                                <button onclick="shareWhatsApp('${person.id}', event)" ${person.items.length === 0 ? 'disabled' : ''} class="w-[30%] bg-[#1c8449] hover:bg-[#126b38] text-white disabled:opacity-40 py-3 rounded-xl text-sm font-bold flex items-center justify-center transition-all shadow-sm"><i class="ph-bold ph-whatsapp-logo text-xl"></i></button>
                            </div>
                        </div>`;
                    container.appendChild(card);
                });
            }
            updateHistoryFilters();
            updateHeader();
        }

        function updateHistoryFilters() {
            const filter = document.getElementById('historyFilter');
            const currentVal = filter.value;
            filter.innerHTML = `<option value="all" class="text-slate-800 bg-white dark:bg-slate-700 dark:text-white">Semua Riwayat</option>`;
            [...new Set(appData.history.map(item => item.personName))].forEach(name => { filter.innerHTML += `<option value="${name}" class="text-slate-800 bg-white dark:bg-slate-700 dark:text-white">${name}</option>`; });
            if([...new Set(appData.history.map(item => item.personName))].includes(currentVal)) filter.value = currentVal;
        }

        function renderHistory() {
            const filterVal = document.getElementById('historyFilter').value;
            const container = document.getElementById('historyList'); container.innerHTML = '';
            let filtered = filterVal !== 'all' ? appData.history.filter(h => h.personName === filterVal) : appData.history;

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center p-6 text-slate-400 italic text-sm border border-dashed border-slate-300 dark:border-slate-700 rounded-2xl">Belum ada riwayat transaksi.</div>`; return;
            }

            filtered.forEach(history => {
                const isFull = history.type === 'full';
                const itemsDesc = history.items.map(i => `${i.name} (<span class="money-value">${formatNumber(i.paidAmount)}</span>)`).join('<br>');
                const isNgutangin = history.sourceList === 'ngutangin';
                const sourceTitle = isNgutangin ? 'UANG DITERIMA' : 'UANG KELUAR';
                const sign = isNgutangin ? '+' : '-';
                const colorTheme = isNgutangin ? 'emerald' : 'orange';

                container.innerHTML += `
                    <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 border-l-4 border-${colorTheme}-500 shadow-sm transition-colors duration-300">
                        <div class="flex justify-between items-start mb-3">
                            <div class="font-bold text-slate-700 dark:text-slate-200 flex items-center gap-2">
                                ${isFull ? `<div class="bg-${colorTheme}-100 text-${colorTheme}-600 dark:bg-${colorTheme}-900/40 dark:text-${colorTheme}-400 p-1 rounded-full"><i class="ph-fill ph-check-circle text-lg"></i></div>` : '<div class="bg-slate-100 text-slate-600 dark:bg-slate-700 dark:text-slate-400 p-1 rounded-full"><i class="ph-bold ph-clock-counter-clockwise text-lg"></i></div>'}
                                <span>${history.personName} <span class="text-[9px] uppercase font-bold text-slate-500 bg-slate-100 dark:bg-slate-700 px-1.5 py-0.5 rounded ml-1">${isFull ? 'Lunas' : 'Cicilan'}</span></span>
                            </div>
                            <div class="text-right text-[10px] text-slate-400"><div class="font-bold tracking-wider">${history.date}</div><div>${history.time}</div></div>
                        </div>
                        <div class="text-xs text-slate-600 dark:text-slate-400 mb-3 leading-relaxed border-b border-slate-100 dark:border-slate-700 pb-3">${itemsDesc}</div>
                        <div class="flex justify-between items-end">
                            <div class="flex flex-col">
                                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">${sourceTitle}</span>
                                ${history.changeAmount > 0 ? `<div class="mt-1 text-[10px] font-bold text-orange-600 dark:text-orange-500 bg-orange-50 dark:bg-orange-900/30 px-2 py-1 rounded inline-block money-value">Ada Kembalian: ${formatRupiah(history.changeAmount)}</div>` : ''}
                            </div>
                            <span class="font-black text-${colorTheme}-600 dark:text-${colorTheme}-400 text-lg tracking-tight money-value">${sign} ${formatRupiah(history.totalAmount)}</span>
                        </div>
                    </div>`;
            });
            updateHeader();
        }

        function clearHistory() {
            showConfirm("Hapus Semua Riwayat?", "Riwayat tidak bisa dikembalikan.", () => { appData.history = []; saveData(); }, "Hapus", "bg-red-500 hover:bg-red-600", true);
        }

        function exportData() {
            const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(appData)], { type: 'application/json' }));
            a.download = `Backup_Ngutang_${new Date().toLocaleDateString('id-ID').replace(/\//g, '-')}.json`; a.click(); closeSheet('settingsSheet');
        }
        function importData(event) {
            const file = event.target.files[0]; if (!file) return; const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported.ngutangin || imported.active) {
                        appData.ngutangin = imported.ngutangin || imported.active || []; appData.utangSaya = imported.utangSaya || []; appData.history = imported.history || [];
                        saveData(); closeSheet('settingsSheet'); showAlert("Sukses", "Data berhasil direstore.");
                    }
                } catch (err) { showAlert("Error", "Format file tidak valid."); }
            }; reader.readAsText(file);
        }
        function triggerClearData() {
            showConfirm("Hapus SEMUA Data?", "Semua data aktif dan riwayat akan hilang selamanya.", () => { appData = { ngutangin: [], utangSaya: [], history: [] }; selectedCheckboxes = {}; saveData(); closeSheet('settingsSheet'); }, "Hapus Semua", "bg-red-500 hover:bg-red-600", true);
        }

        function toggleTheme() {
            document.documentElement.classList.toggle('dark'); const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light'); updateThemeUI(isDark);
        }
        function updateThemeUI(isDark) {
            const icon = document.getElementById('themeIcon'); const metaTheme = document.getElementById('themeColorMeta');
            if(isDark) { icon.classList.replace('ph-moon', 'ph-sun'); metaTheme.setAttribute('content', '#1e293b'); } 
            else { icon.classList.replace('ph-sun', 'ph-moon'); metaTheme.setAttribute('content', '#2563eb'); }
        }

        // PWA Initialization
        (function setupPWA() {
            const manifest = {
                name: "Ngutang", short_name: "Ngutang", start_url: ".", display: "standalone",
                background_color: "#f8fafc", theme_color: "#2563eb",
                icons: [{ src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E%3Crect width='256' height='256' fill='none'/%3E%3Crect x='32' y='48' width='192' height='160' rx='8' fill='%232563eb'/%3E%3Cpath d='M32 104h192' fill='none' stroke='%23fff' stroke-linecap='round' stroke-linejoin='round' stroke-width='16'/%3E%3C/svg%3E", sizes: "192x192", type: "image/svg+xml" }]
            };
            const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
            const pwaLink = document.createElement('link'); pwaLink.rel = 'manifest'; pwaLink.href = URL.createObjectURL(manifestBlob); document.head.appendChild(pwaLink);
            
            let deferredPrompt;
            window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; document.getElementById('installBtn').classList.remove('hidden'); });
            document.getElementById('installBtn').addEventListener('click', async () => { if (deferredPrompt) { deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; document.getElementById('installBtn').classList.add('hidden'); } closeSheet('settingsSheet'); });
        })();

        // INIT
        loadData();
        
        // Initial Privacy UI Setup
        if(settings.privacyMode) { 
            document.body.classList.add('privacy-on'); 
            document.getElementById('privacyIcon').classList.replace('ph-eye', 'ph-eye-closed'); 
        } else {
            resetPrivacyTimer();
        }

        switchTab(settings.lastTab);

    </script>
</body>
</html>
